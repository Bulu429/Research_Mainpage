<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMT日频看板</title>
<!-- TMT_HISTORY_NAV -->
<link rel="stylesheet" href="history-nav.css">
<script src="history-data.js"></script>
<script src="history-nav.js" defer></script>
<!-- /TMT_HISTORY_NAV -->
<style>
:root {
  --bg:             #F5F2EC;
  --bg-subtle:      #EDE9E1;
  --card:           #FFFFFF;
  --border:         #DDD8CE;
  --border-light:   #EDE9E3;
  --text:           #1C1917;
  --text-secondary: #6B6459;
  --text-muted:     #A09A90;
  --navy:           #1B3A5C;
  --gold:           #8B7335;
  --up:             #D13B3B;
  --up-bg:          #FBEAEA;
  --down:           #16915A;
  --down-bg:        #E6F5EC;
  --font-body: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-data: "SF Mono", "Consolas", monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  line-height: 1.6;
  padding: 28px 36px 60px;
  min-width: 1100px;
}
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg-subtle); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.header {
  display: flex; align-items: flex-end; justify-content: space-between;
  margin-bottom: 20px; padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.header-title { font-size: 20px; font-weight: 700; color: var(--text); }
.header-title span { color: var(--navy); }
.header-meta { font-size: 11px; color: var(--text-muted); margin-top: 4px; line-height: 1.8; }
.header-meta b { color: var(--text-secondary); }

.stats-row {
  display: flex; gap: 12px; margin-bottom: 18px; flex-wrap: wrap;
}
.stat-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 16px; min-width: 108px;
}
.stat-card .label { font-size: 10px; color: var(--text-muted); }
.stat-card .value { font-size: 20px; font-weight: 700; margin-top: 2px; font-family: var(--font-data); }
.stat-card .value.up { color: var(--up); }
.stat-card .value.down { color: var(--down); }

.turnover-share-panel {
  background:var(--card);border:1px solid var(--border);border-radius:8px;
  margin-bottom:18px;overflow:hidden;
}
.turnover-share-head { display:flex;justify-content:space-between;gap:16px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--border-light);background:#FBFAF7; }
.turnover-share-title { font-size:13px;font-weight:800;color:var(--navy); }
.turnover-share-meta { font-size:10px;color:var(--text-muted);font-family:var(--font-data);text-align:right;line-height:1.6; }
.turnover-share-body { padding:14px; }
.turnover-share-cards { display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px; }
.turnover-share-card { border:1px solid var(--border-light);border-radius:7px;padding:13px 14px;background:#fff;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:11px; }
.turnover-share-name { font-size:13px;font-weight:700;color:var(--text-secondary); }
.turnover-share-value { font:700 24px/1 var(--font-data);color:var(--navy);text-align:right; }
.turnover-share-change { grid-column:1/-1;font-size:11px;color:var(--text-muted);line-height:1.5; }
.turnover-share-change .up { color:var(--up); }.turnover-share-change .down { color:var(--down); }
.turnover-share-charts { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px; }
.turnover-share-chart { min-height:230px;border:1px solid var(--border-light);border-radius:7px;padding:10px 10px 5px;background:#fff; }
.turnover-share-chart-title { font-size:12px;font-weight:750;color:var(--text-secondary);text-align:center;margin-bottom:2px; }
.turnover-share-svg { width:100%;height:auto;aspect-ratio:1.85/1;display:block;overflow:visible; }
.turnover-share-grid { stroke:var(--border-light);stroke-width:1;vector-effect:non-scaling-stroke; }
.turnover-share-axis { fill:var(--text-muted);font-size:9px;font-family:var(--font-data); }
.turnover-share-line { fill:none;stroke-width:1.8;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round; }
.turnover-share-dot { stroke:#fff;stroke-width:1.5;vector-effect:non-scaling-stroke; }
.turnover-share-point { vector-effect:non-scaling-stroke; }
.turnover-share-peak { font-size:9px;font-weight:700;font-family:var(--font-data);paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round; }
.turnover-share-trough { fill:#fff;stroke-width:2;vector-effect:non-scaling-stroke; }
.turnover-share-extrema-note { font-weight:400;color:var(--text-muted);margin-left:8px; }
.turnover-share-error { padding:14px;color:var(--down);font-size:11px; }

.treemap-panel { background:var(--card);border:1px solid var(--border);border-radius:8px;margin-bottom:18px;overflow:hidden; }
.treemap-head { display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:11px 14px;border-bottom:1px solid var(--border-light);background:#fbfaf7; }
.treemap-title { font-size:13px;font-weight:800;color:var(--navy); }
.treemap-meta { font-size:10px;color:var(--text-muted);text-align:right;line-height:1.6; }
.treemap-wrap { padding:10px;background:#f7f5f1; }
.treemap-svg { width:100%;height:auto;display:block;background:#fff; }
.treemap-l1 { fill:none;stroke:#fff;stroke-width:5; }
.treemap-l2 { fill:none;stroke:#fff;stroke-width:2.5; }
.treemap-l3 { fill:none;stroke:rgba(255,255,255,.9);stroke-width:1.5; }
.treemap-cell { stroke:#fff;stroke-width:1; }
.treemap-leaf { cursor:pointer;outline:none; }
.treemap-leaf .treemap-cell { transition:stroke-width .14s ease,stroke .14s ease,filter .14s ease; }
.treemap-leaf:hover .treemap-cell,.treemap-leaf:focus .treemap-cell { stroke:#173a5e;stroke-width:2.5;filter:brightness(1.03); }
.treemap-leaf.active .treemap-cell { stroke:#0f2f4e;stroke-width:4;filter:drop-shadow(0 3px 5px rgba(15,47,78,.22)); }
.treemap-group-label { fill:#243548;font-weight:800;font-size:12px;paint-order:stroke;stroke:#fff;stroke-width:3px; }
.treemap-sub-label { fill:#4f5963;font-weight:700;font-size:9px;paint-order:stroke;stroke:#fff;stroke-width:3px; }
.treemap-stock-name { fill:#17212b;font-weight:700;font-size:10px;text-anchor:middle;pointer-events:none; }
.treemap-stock-pct { fill:#17212b;font-size:9px;text-anchor:middle;pointer-events:none; }
.treemap-detail { margin:0 10px 10px;border:1px solid var(--border);border-radius:7px;background:#fff;overflow:hidden; }
.treemap-detail.empty { padding:13px 14px;color:var(--text-muted);font-size:11px;border-style:dashed;background:#fbfaf7; }
.treemap-detail-head { display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:12px 14px;border-bottom:1px solid var(--border-light);background:#fbfaf7; }
.treemap-detail-path { font-size:14px;font-weight:800;color:var(--navy); }
.treemap-detail-sub { margin-top:2px;color:var(--text-muted);font-size:10px; }
.treemap-detail-close { border:0;background:transparent;color:var(--text-muted);font-size:18px;line-height:1;cursor:pointer;padding:2px 4px; }
.treemap-detail-close:hover { color:var(--navy); }
.treemap-detail-chips { display:flex;flex-wrap:wrap;gap:6px;margin-top:8px; }
.treemap-detail-chip { border:1px solid var(--border);border-radius:4px;padding:2px 7px;background:#fff;color:var(--text-secondary);font-size:10px; }
.treemap-detail-chip.up { color:var(--up);border-color:#efc5c5;background:var(--up-bg); }
.treemap-detail-chip.down { color:var(--down);border-color:#b9dfca;background:var(--down-bg); }
.treemap-detail-table-wrap { overflow-x:auto;max-height:330px;overflow-y:auto; }
.treemap-detail-table { min-width:760px; }
.treemap-detail-table th { position:sticky;top:0;z-index:1;background:#f2efe9;font-size:10px;padding:7px 10px; }
.treemap-detail-table td { padding:7px 10px;font-size:11px;border-bottom:1px solid var(--border-light); }
.treemap-detail-table tr:last-child td { border-bottom:0; }
.treemap-detail-name { font-weight:700;color:var(--text); }
.treemap-detail-code { margin-top:1px;color:var(--text-muted);font:9px var(--font-data); }

.daily-chain-panel {
  background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  margin-bottom: 18px; overflow: hidden;
}
.daily-chain-head {
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:12px 14px;border-bottom:1px solid var(--border-light);background:#FBFAF7;
}
.daily-chain-title { font-size:13px;font-weight:800;color:var(--navy); }
.daily-chain-head-actions { display:flex;align-items:center;gap:10px; }
.daily-chain-reset { border:1px solid var(--border);border-radius:5px;padding:4px 8px;background:#fff;color:var(--text-secondary);font-size:10px;cursor:pointer;white-space:nowrap; }
.daily-chain-reset:hover { border-color:var(--gold);color:var(--navy); }
.daily-chain-meta { font-size:10px;color:var(--text-muted);font-family:var(--font-data);text-align:right; }
.daily-chain-summary {
  margin:12px 14px 0;padding:9px 11px;border-left:3px solid var(--navy);border-radius:5px;
  background:#f1f4f7;color:var(--text-secondary);font-size:11px;line-height:1.7;
}
.daily-chain-shell { display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;padding:12px 14px 10px; }
.daily-chain-stage {
  min-height:560px;border:1px solid var(--border);border-radius:7px;overflow-x:auto;overflow-y:hidden;
  background:linear-gradient(135deg,rgba(255,255,255,.96),rgba(248,247,243,.96)),repeating-linear-gradient(0deg,rgba(139,115,53,.06) 0 1px,transparent 1px 20px);
}
.daily-chain-map { width:100%;min-width:880px;min-height:560px;display:block; }
.daily-chain-edge { stroke:#80786d;stroke-width:.24;fill:none;vector-effect:non-scaling-stroke;opacity:.55; }
.daily-chain-edge.dashed { stroke-dasharray:1.15 1.15;opacity:.35; }
.daily-chain-node { cursor:grab;outline:none;touch-action:none;user-select:none; }
.daily-chain-node.dragging { cursor:grabbing; }
.daily-chain-node-shape { stroke-width:.36;vector-effect:non-scaling-stroke;filter:drop-shadow(0 5px 8px rgba(28,25,23,.10)); }
.daily-chain-node.active .daily-chain-node-shape,.daily-chain-node:focus .daily-chain-node-shape { stroke-width:.7; }
.daily-chain-node-label { text-anchor:middle;dominant-baseline:middle;fill:#1c1917;font-weight:700;pointer-events:none; }
.daily-chain-node-ret { text-anchor:middle;dominant-baseline:middle;font-size:1.02px;font-weight:800;pointer-events:none; }
.daily-chain-detail { border:1px solid var(--border);border-radius:7px;padding:13px;background:rgba(255,255,255,.72);min-height:560px;overflow:auto; }
.daily-chain-detail-title { font-size:14px;font-weight:800;color:var(--navy);margin-bottom:9px; }
.daily-chain-chips { display:flex;flex-wrap:wrap;gap:5px;margin-bottom:11px; }
.daily-chain-chip { border:1px solid var(--border);border-radius:4px;padding:3px 6px;color:var(--text-secondary);font-size:10px;background:#fff; }
.daily-chain-chip.hot { color:var(--up);background:var(--up-bg);border-color:rgba(200,59,59,.25); }
.daily-chain-chip.weak { color:var(--down);background:var(--down-bg);border-color:rgba(32,135,91,.25); }
.daily-chain-table { width:100%;min-width:0;table-layout:fixed;border-radius:0;background:transparent; }
.daily-chain-table th,.daily-chain-table td { padding:7px 3px;text-align:right;white-space:nowrap;font-size:10px; }
.daily-chain-table th:first-child,.daily-chain-table td:first-child { text-align:left;white-space:normal; }
.daily-chain-stock-name { font-weight:700; }
.daily-chain-stock-code { color:var(--text-muted);font-size:9px;margin-top:2px; }
.daily-chain-empty { color:var(--text-muted);font-size:11px;line-height:1.7; }
.daily-chain-legend { display:flex;gap:13px;align-items:center;flex-wrap:wrap;padding:0 14px 13px;color:var(--text-muted);font-size:10px; }
.daily-chain-legend i { width:8px;height:8px;display:inline-block;border-radius:50%;margin-right:4px;border:1px solid currentColor; }

.toolbar {
  display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap;
}
.toolbar input[type=text] {
  padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px;
  font-size: 12px; width: 200px; background: var(--card); color: var(--text);
}
.toolbar select {
  padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px;
  font-size: 12px; background: var(--card); color: var(--text);
}
.toolbar .legend { font-size: 10px; color: var(--text-muted); margin-left: auto; display: flex; align-items: center; gap: 10px; }
.dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:3px; vertical-align:middle; }
.dot.up { background: var(--up); }
.dot.down { background: var(--down); }
.dot.na { background: var(--border); }

.table-scroll { width:100%; overflow-x:auto; border-radius:8px; }
table { width: 100%; min-width:960px; border-collapse: collapse; background: var(--card); border-radius: 8px; overflow: hidden; }
thead th {
  text-align: left; font-size: 10px; font-weight: 700; color: var(--text-secondary);
  padding: 8px 8px; border-bottom: 1px solid var(--border); background: var(--bg-subtle);
  cursor: pointer; white-space: nowrap; user-select: none;
}
thead th:hover { color: var(--navy); }
thead th.sorted::after { content: ' \25BE'; }
thead th.sorted.asc::after { content: ' \25B4'; }
tbody td { padding: 6px 8px; font-size: 12px; border-bottom: 1px solid var(--border-light); }
tbody tr:hover { background: var(--bg-subtle); }
tr.group-row td {
  font-size: 10px; font-weight: 700; color: var(--gold); letter-spacing: .5px;
  background: var(--bg-subtle); padding: 6px 8px 4px; border-bottom: 1px solid var(--border);
}
tr.subgroup-row td {
  font-size: 10px; font-weight: 650; color: var(--navy); letter-spacing: .2px;
  background: #faf9f6; padding: 5px 8px 4px 22px; border-bottom: 1px solid var(--border-light);
}
.subgroup-count { color: var(--text-muted); font-weight: 500; margin-left: 5px; }
.num { text-align: right; font-family: var(--font-data); }
.col-industry { width: 180px; min-width: 180px; max-width: 220px; white-space: nowrap; }
.industry-cell { display: inline-flex; align-items: baseline; gap: 6px; white-space: nowrap; }
.industry-sub { font-size: 10px; color: var(--text-muted); }
.pct-bar-track { position:relative;width:110px;height:8px;background:var(--border-light);border-radius:4px;overflow:hidden;flex-shrink:0; }
.pct-bar-track::after { content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:#b9b3a8;z-index:2; }
.pct-bar-fill { position:absolute;top:1px;height:6px;border-radius:3px; }
.name-cell { font-weight: 600; }
.code-cell { color: var(--text-muted); font-size: 10px; font-family: var(--font-data); }
.pct { font-weight: 600; }
.pct.up { color: var(--up); }
.pct.down { color: var(--down); }
.pct.flat { color: var(--text-muted); }
.tag-newhigh {
  display: inline-block; font-size: 9px; font-weight: 700; padding: 1px 5px;
  border-radius: 3px; background: var(--up-bg); color: var(--up); border: 1px solid rgba(139,58,58,.25);
}
.tag-newlow {
  display: inline-block; font-size: 9px; font-weight: 700; padding: 1px 5px;
  border-radius: 3px; background: var(--down-bg); color: var(--down); border: 1px solid rgba(32,135,91,.25);
}
.name-cell .tag-newhigh,.name-cell .tag-newlow { margin-left:4px; }
.tag-suspended {
  display: inline-block; font-size: 9px; font-weight: 700; padding: 1px 5px;
  margin-left: 4px; border-radius: 3px; background: var(--bg-subtle); color: var(--text-secondary);
  border: 1px solid var(--border); cursor: help;
}
.dd-text { font-size: 11px; }

.commentary {
  background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  padding: 12px 16px; margin-bottom: 18px;
}
.commentary-title { font-size:13px;font-weight:800;color:var(--navy);padding:0 0 8px; }
.commentary-row { display: flex; align-items: flex-start; gap: 10px; padding: 4px 0; font-size: 12px; line-height: 1.9; }
.commentary-row + .commentary-row { border-top: 1px dashed var(--border-light); }
.commentary-label {
  flex-shrink: 0; width: 88px; font-size: 11px; font-weight: 700; color: var(--text-secondary); padding-top: 2px;
}
.chip {
  display: inline-flex; align-items: center; border-radius: 4px; padding: 1px 6px;
  font-size: 11px; font-weight: 600; margin: 1px 3px 1px 0; white-space: nowrap;
}
.chip.up { background: var(--up-bg); color: var(--up); border: 1px solid rgba(139,58,58,.2); }
.chip.down { background: var(--down-bg); color: var(--down); border: 1px solid rgba(46,97,72,.2); }
.chip.plain { background: var(--bg-subtle); color: var(--text-secondary); border: 1px solid var(--border-light); }
.commentary-text { font-size: 11px; color: var(--text-muted); }

.bottom-watch {
  background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  margin-bottom: 18px; overflow: hidden;
}
.bottom-watch-head {
  display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 18px; align-items: center;
  padding: 15px 16px; background: linear-gradient(115deg,#fffefa 0%,#f3efe6 100%);
  border-bottom: 1px solid var(--border-light);
}
.bottom-watch-kicker { font-size: 10px; font-weight: 700; color: var(--gold); letter-spacing: .8px; }
.bottom-watch-title { display:flex;align-items:center;gap:9px;margin-top:2px;font-size:17px;font-weight:800;color:var(--navy); }
.bottom-watch-meta { margin-top: 4px; font-size: 10px; color: var(--text-muted); font-family: var(--font-data); }
.bottom-score { display:flex;align-items:baseline;gap:4px;font-family:var(--font-data);color:var(--navy); }
.bottom-score strong { font-size: 31px; line-height: 1; }
.bottom-score span { font-size: 12px; color: var(--text-muted); }
.stage-badge { font-size:10px;padding:2px 7px;border-radius:999px;border:1px solid var(--border);background:var(--bg-subtle);color:var(--text-secondary); }
.stage-badge.positive { background:var(--up-bg);border-color:rgba(139,58,58,.2);color:var(--up); }
.bottom-watch-body { padding: 13px 16px 15px; }
.bottom-watch-summary { display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--border-light);border-radius:7px;overflow:hidden;margin-bottom:11px; }
.bottom-watch-metric { padding:9px 11px;border-right:1px solid var(--border-light); }
.bottom-watch-metric:last-child { border-right:0; }
.bottom-watch-metric .label { font-size:9px;color:var(--text-muted); }
.bottom-watch-metric .value { margin-top:2px;font-size:15px;font-weight:700;font-family:var(--font-data); }
.bottom-progress { display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin:9px 0 12px; }
.bottom-progress span { height:5px;border-radius:3px;background:var(--border-light); }
.bottom-progress span.pass { background:var(--up); }
.bottom-note { display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:11px;color:var(--text-secondary); }
.bottom-trigger { flex-shrink:0;font-size:10px;border-radius:4px;padding:2px 6px;border:1px solid var(--border);background:var(--bg-subtle); }
.bottom-trigger.on { color:var(--up);background:var(--up-bg);border-color:rgba(139,58,58,.2); }
.bottom-check-details { margin-top:10px;border-top:1px solid var(--border-light);padding-top:9px; }
.bottom-check-details summary { cursor:pointer;list-style:none;font-size:11px;font-weight:700;color:var(--navy); }
.bottom-check-details summary::-webkit-details-marker { display:none; }
.bottom-check-details summary::after { content:'展开/收起';float:right;font-size:9px;font-weight:400;color:var(--text-muted); }
.bottom-check-grid { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:9px; }
.bottom-check-item { display:grid;grid-template-columns:18px minmax(120px,1fr) minmax(108px,.8fr) minmax(105px,.8fr);gap:7px;align-items:center;padding:7px 8px;border:1px solid var(--border-light);border-radius:6px;background:#fff; }
.bottom-check-icon { width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;background:var(--bg-subtle);color:var(--text-muted); }
.bottom-check-item.pass .bottom-check-icon { background:var(--up-bg);color:var(--up); }
.bottom-check-name { font-size:11px;font-weight:700;line-height:1.3; }
.bottom-check-stage { display:block;font-size:8px;color:var(--text-muted);font-weight:500;margin-top:2px; }
.bottom-check-value { text-align:right;font-size:11px;font-weight:700;font-family:var(--font-data); }
.bottom-check-ref { text-align:right;font-size:9px;color:var(--text-muted);line-height:1.35; }

function renderTurnoverShare() {
  const panel = document.getElementById('turnoverSharePanel');
  if (!turnoverShare.available) {
    panel.innerHTML = `<div class="turnover-share-error">成交额占比暂不可用：${turnoverShare.error || '未读取到数据'}</div>`;
    return;
  }
  const palette = {'全A成交额':'#64748b','创业板指':'#b45309','科创50':'#1d4ed8','全网状图':'#b91c1c'};
  const pct = value => `${(value * 100).toFixed(2)}%`;
  const bp = value => `${value > 0 ? '+' : ''}${(value * 10000).toFixed(1)}bp`;
  const cards = turnoverShare.metrics.map(metric => {
    const cls = metric.change > 0 ? 'up' : metric.change < 0 ? 'down' : '';
    const intervalHigh = Math.max(...turnoverShare.series.map(row => row[metric.key]));
    const intervalLow = Math.min(...turnoverShare.series.map(row => row[metric.key]));
    return `<div class="turnover-share-card">
      <div class="turnover-share-name"><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${palette[metric.key]};margin-right:6px"></i>${metric.key}</div>
      <div class="turnover-share-value">${pct(metric.latest)}</div>
      <div class="turnover-share-change">较前一日 <span class="${cls}">${bp(metric.change)}</span> · 区间均值 ${pct(metric.average)} · 区间最高 ${pct(intervalHigh)} · 区间最低 ${pct(intervalLow)}</div>
    </div>`;
  }).join('');
  const chart = (rows, key, title, isPercent=true) => {
    const values = rows.map(row => row[key]).filter(Number.isFinite);
    const rawMin = Math.min(...values), rawMax = Math.max(...values);
    const padding = Math.max((rawMax-rawMin)*.12, rawMax*.025, .0001);
    const min = Math.max(0, rawMin-padding), max = rawMax+padding;
    const W=560,H=285,L=58,R=22,T=18,B=38;
    const x = index => L + index * (W-L-R) / Math.max(1, rows.length-1);
    const y = value => T + (max-value) * (H-T-B) / Math.max(.000001,max-min);
    const format = value => isPercent ? pct(value) : Math.round(value).toLocaleString('zh-CN');
    const ticks = Array.from({length:6},(_,i)=>min+(max-min)*i/5);
    const grid = ticks.map(value => `<line class="turnover-share-grid" x1="${L}" x2="${W-R}" y1="${y(value)}" y2="${y(value)}"/><text class="turnover-share-axis" text-anchor="end" x="${L-7}" y="${y(value)+3}">${format(value)}</text>`).join('');
    const points = rows.map((row,index)=>`${x(index)},${y(row[key])}`).join(' ');
    const pointDots = rows.map((row,index)=>`<circle class="turnover-share-point" fill="${palette[key]}" cx="${x(index)}" cy="${y(row[key])}" r="1.35"/>`).join('');
    const peakIndex = rows.reduce((best,row,index) => row[key] > rows[best][key] ? index : best, 0);
    const troughIndex = rows.reduce((best,row,index) => row[key] < rows[best][key] ? index : best, 0);
    const lastIndex = rows.length-1;
    const marker = (index, hollow, dy) => {
      const value = rows[index][key], anchor = index > rows.length*.82 ? 'end' : 'start', dx = anchor==='end' ? -5 : 5;
      return `<circle class="${hollow?'turnover-share-trough':'turnover-share-dot'}" ${hollow?`fill="#fff" stroke="${palette[key]}"`:`fill="${palette[key]}"`} cx="${x(index)}" cy="${y(value)}" r="3"/><text class="turnover-share-peak" fill="${palette[key]}" text-anchor="${anchor}" x="${x(index)+dx}" y="${y(value)+dy}">${format(value)}</text>`;
    };
    const labelIndexes = Array.from(new Set(Array.from({length:6},(_,i)=>Math.round(i*lastIndex/5))));
    const dateLabels = labelIndexes.map((index,i)=>`<text class="turnover-share-axis" text-anchor="${i===0?'start':i===labelIndexes.length-1?'end':'middle'}" x="${x(index)}" y="${H-8}">${rows[index].date.slice(5)}</text>`).join('');
    return `<div class="turnover-share-chart"><div class="turnover-share-chart-title">${title}</div><svg class="turnover-share-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}趋势">${grid}<polyline class="turnover-share-line" stroke="${palette[key]}" points="${points}"/>${pointDots}${marker(peakIndex,false,-8)}${marker(troughIndex,true,13)}${lastIndex!==peakIndex&&lastIndex!==troughIndex?marker(lastIndex,false,-8):''}${dateLabels}</svg></div>`;
  };
  const allRows = turnoverShare.series;
  const charts = chart(allRows,'全A成交额','全A成交额（亿元）',false)
    + chart(allRows,'科创50','科创50占全A比重')
    + chart(allRows,'创业板指','创业板指占全A比重')
    + chart(allRows,'全网状图','全网状图成交额占全A比重');
  panel.innerHTML = `<div class="turnover-share-head"><div class="turnover-share-title">成交额与占全A比重</div><div class="turnover-share-meta">数据 ${turnoverShare.as_of} · 2026-01-01以来 ${turnoverShare.window} 个有效交易日<br>占比口径：对应成交额 ÷ 全A成交额 · 最高实心点 · 最低空心点</div></div><div class="turnover-share-body"><div class="turnover-share-cards">${cards}</div><div class="turnover-share-charts">${charts}</div></div>`;
}
renderTurnoverShare();

const dailyChain = DATA.daily_chain_map || {};
let dailyChainActiveId = null;
const dailyChainLayoutKey = 'daily-tmt-chain-layout-v1';
const dailyChainDefaultLayout = Object.fromEntries((dailyChain.nodes || []).map(node => [node.id, {x:node.x,y:node.y}]));
let dailyChainLayoutMemory = {};

function loadDailyChainLayout() {
  try {
    return {...(JSON.parse(localStorage.getItem(dailyChainLayoutKey) || '{}') || {}), ...dailyChainLayoutMemory};
  } catch (error) {
    return dailyChainLayoutMemory;
  }
}

function applyDailyChainLayout(layout) {
  (dailyChain.nodes || []).forEach(node => {
    const position = layout[node.id];
    if (!position || !Number.isFinite(position.x) || !Number.isFinite(position.y)) return;
    node.x = position.x;
    node.y = position.y;
  });
}

function saveDailyChainLayout(nodes) {
  dailyChainLayoutMemory = Object.fromEntries(nodes.map(node => [node.id, {
    x:Math.round(node.x * 10) / 10,
    y:Math.round(node.y * 10) / 10,
  }]));
  try {
    localStorage.setItem(dailyChainLayoutKey, JSON.stringify(dailyChainLayoutMemory));
  } catch (error) {
    // file:// 环境若限制 localStorage，当前页面内的布局仍然有效。
  }
}

function resetDailyChainLayout() {
  dailyChainLayoutMemory = {};
  try { localStorage.removeItem(dailyChainLayoutKey); } catch (error) {}
  applyDailyChainLayout(dailyChainDefaultLayout);
  renderDailyChainGraph();
}

applyDailyChainLayout(loadDailyChainLayout());

function chainPct(value, digits = 2) {
  if (value === null || value === undefined || !Number.isFinite(value)) return '—';
  return `${value >= 0 ? '+' : ''}${value.toFixed(digits)}%`;
}

function chainAmt(value) {
  if (value === null || value === undefined || !Number.isFinite(value)) return '—';
  return value.toFixed(1);
}

function chainHeat(value) {
  if (value === null || value === undefined || !Number.isFinite(value)) return {cls:'empty',fill:'#f2f0eb',stroke:'#a8a29e'};
  if (value >= 5) return {cls:'hot',fill:'#fee2e2',stroke:'#b91c1c'};
  if (value >= 2) return {cls:'hot',fill:'#ffe4d6',stroke:'#dc2626'};
  if (value >= 0) return {cls:'neutral',fill:'#fef3c7',stroke:'#d97706'};
  return {cls:'weak',fill:'#dcfce7',stroke:'#16a34a'};
}

function chainLabelLines(name) {
  if ((name || '').includes('CapEx')) return name.split(' ');
  return [name || ''];
}

function dailyChainSvgPoint(svg, event) {
  const point = svg.createSVGPoint();
  point.x = event.clientX;
  point.y = event.clientY;
  return point.matrixTransform(svg.getScreenCTM().inverse());
}

function clampDailyChainNode(node, viewBox) {
  node.x = Math.max(node.w / 2 + .5, Math.min(viewBox.width - node.w / 2 - .5, node.x));
  node.y = Math.max(node.h / 2 + .5, Math.min(viewBox.height - node.h / 2 - .5, node.y));
}

function updateDailyChainEdges(svg, byId) {
  svg.querySelectorAll('.daily-chain-edge').forEach(line => {
    const from = byId.get(line.dataset.from), to = byId.get(line.dataset.to);
    if (!from || !to) return;
    line.setAttribute('x1', from.x); line.setAttribute('y1', from.y);
    line.setAttribute('x2', to.x); line.setAttribute('y2', to.y);
  });
}

function renderDailyChainDetail(node) {
  const detail = document.getElementById('dailyChainDetail');
  if (!detail) return;
  if (!node || !(node.stocks || []).length) {
    detail.innerHTML = `<div class="daily-chain-detail-title">${node ? node.name : '节点明细'}</div><div class="daily-chain-empty">该节点暂无股票映射或日频数据。</div>`;
    return;
  }
  const heat = chainHeat(node.retWeighted);
  const rows = node.stocks.map(stock => `<tr>
    <td><div class="daily-chain-stock-name">${stock.name}</div><div class="daily-chain-stock-code">${stock.code}</div></td>
    <td class="${stock.pct_chg >= 0 ? 'up' : 'down'}">${chainPct(stock.pct_chg)}</td>
    <td>${chainPct(stock.turn_pct)}</td>
    <td>${chainAmt(stock.amt_yi)}</td>
  </tr>`).join('');
  detail.innerHTML = `
    <div class="daily-chain-detail-title">${node.name}</div>
    <div class="daily-chain-chips">
      <span class="daily-chain-chip ${heat.cls === 'hot' ? 'hot' : heat.cls === 'weak' ? 'weak' : ''}">成交额加权 ${chainPct(node.retWeighted)}</span>
      <span class="daily-chain-chip">中位数 ${chainPct(node.retMedian)}</span>
      <span class="daily-chain-chip">平均 ${chainPct(node.retAvg)}</span>
      <span class="daily-chain-chip">换手率中位数 ${chainPct(node.turnoverMedian)}</span>
      <span class="daily-chain-chip">成交额 ${chainAmt(node.amountSum)} 亿</span>
      <span class="daily-chain-chip">${node.stocks.length} 只</span>
    </div>
    <table class="daily-chain-table">
      <thead><tr><th>股票</th><th>涨跌幅</th><th>换手率</th><th>成交额(亿)</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function renderDailyChainGraph() {
  const panel = document.getElementById('dailyChainPanel');
  if (!dailyChain.available) {
    panel.innerHTML = `<div class="bottom-error">产业链网状图暂不可用：${dailyChain.error || '未读取到节点映射'}</div>`;
    return;
  }
  const nodes = dailyChain.nodes || [];
  const edges = dailyChain.edges || [];
  const valued = nodes.filter(node => Number.isFinite(node.retWeighted) && (node.stocks || []).length);
  const strong = [...valued].sort((a,b) => b.retWeighted - a.retWeighted).slice(0,3);
  const weak = [...valued].sort((a,b) => a.retWeighted - b.retWeighted).slice(0,2);
  const coverage = dailyChain.coverage || {};
  const summary = valued.length
    ? `当日强势节点：${strong.map(node => `${node.name} ${chainPct(node.retWeighted)}`).join(' / ')}。` +
      (weak[0]?.retWeighted < 0 ? ` 偏弱节点：${weak.map(node => `${node.name} ${chainPct(node.retWeighted)}`).join(' / ')}。` : '')
    : '暂无足够日频数据。';
  panel.innerHTML = `
    <div class="daily-chain-head">
      <div class="daily-chain-title">日频产业链节点涨跌幅</div>
      <div class="daily-chain-head-actions">
        <div class="daily-chain-meta">节点颜色 = 成交额加权当日涨跌幅 · 拖动节点调整布局 · 点击查看成分股<br>覆盖 ${coverage.matched_stocks || 0}/${coverage.mapped_codes || 0} 只映射股票 · ${coverage.active_nodes || 0}/${coverage.node_count || nodes.length} 个有效节点</div>
        <button class="daily-chain-reset" id="dailyChainReset" type="button">恢复默认布局</button>
      </div>
    </div>
    <div class="daily-chain-summary">${summary}</div>
    <div class="daily-chain-shell">
      <div class="daily-chain-stage"><svg class="daily-chain-map" id="dailyChainMap" role="img" aria-label="日频产业链节点涨跌幅网状图"></svg></div>
      <aside class="daily-chain-detail" id="dailyChainDetail"><div class="daily-chain-empty">点击节点查看明细</div></aside>
    </div>
    <div class="daily-chain-legend">
      <span><i style="color:#b91c1c;background:#fee2e2"></i>强势 ≥ +5%</span>
      <span><i style="color:#dc2626;background:#ffe4d6"></i>偏强 +2%~+5%</span>
      <span><i style="color:#d97706;background:#fef3c7"></i>中性 0~+2%</span>
      <span><i style="color:#16a34a;background:#dcfce7"></i>下跌</span>
      <span><i style="color:#a8a29e;background:#f2f0eb"></i>无数据</span>
    </div>`;

  const svg = document.getElementById('dailyChainMap');
  document.getElementById('dailyChainReset').addEventListener('click', resetDailyChainLayout);
  const viewBox = dailyChain.viewBox || {width:112,height:68};
  svg.setAttribute('viewBox', `0 0 ${viewBox.width} ${viewBox.height}`);
  const byId = new Map(nodes.map(node => [node.id, node]));
  if (!dailyChainActiveId) dailyChainActiveId = strong[0]?.id || nodes[0]?.id;

  edges.forEach(edge => {
    const from = byId.get(edge.from), to = byId.get(edge.to);
    if (!from || !to) return;
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', from.x); line.setAttribute('y1', from.y);
    line.setAttribute('x2', to.x); line.setAttribute('y2', to.y);
    line.dataset.from = edge.from; line.dataset.to = edge.to;
    line.classList.add('daily-chain-edge');
    if (edge.style === 'dashed') line.classList.add('dashed');
    svg.appendChild(line);
  });

  nodes.forEach(node => {
    const heat = chainHeat(node.retWeighted);
    const group = document.createElementNS('http://www.w3.org/2000/svg','g');
    group.classList.add('daily-chain-node');
    if (node.id === dailyChainActiveId) group.classList.add('active');
    group.dataset.nodeId = node.id;
    group.setAttribute('tabindex','0');
    group.setAttribute('role','button');
    group.setAttribute('aria-label', `${node.name}，成交额加权涨跌幅 ${chainPct(node.retWeighted)}`);
    const activate = () => { dailyChainActiveId = node.id; renderDailyChainGraph(); };
    group.addEventListener('click', event => {
      if (group.dataset.justDragged === '1') {
        event.preventDefault(); event.stopPropagation(); group.dataset.justDragged = '0'; return;
      }
      activate();
    });
    group.addEventListener('pointerdown', event => {
      if (event.button !== 0) return;
      event.preventDefault();
      group.setPointerCapture(event.pointerId);
      group.classList.add('dragging');
      const start = dailyChainSvgPoint(svg, event);
      const origin = {x:node.x,y:node.y};
      let moved = false;

      const move = pointerEvent => {
        const current = dailyChainSvgPoint(svg, pointerEvent);
        const dx = current.x - start.x, dy = current.y - start.y;
        if (Math.abs(dx) + Math.abs(dy) > .15) moved = true;
        node.x = origin.x + dx; node.y = origin.y + dy;
        clampDailyChainNode(node, viewBox);
        group.setAttribute('transform', `translate(${node.x-origin.x}, ${node.y-origin.y})`);
        updateDailyChainEdges(svg, byId);
      };
      const finish = pointerEvent => {
        if (group.hasPointerCapture(pointerEvent.pointerId)) group.releasePointerCapture(pointerEvent.pointerId);
        group.classList.remove('dragging');
        group.removeEventListener('pointermove', move);
        group.removeEventListener('pointerup', finish);
        group.removeEventListener('pointercancel', finish);
        if (moved) {
          pointerEvent.stopPropagation();
          saveDailyChainLayout(nodes);
          group.dataset.justDragged = '1';
          dailyChainActiveId = node.id;
          renderDailyChainGraph();
        }
      };
      group.addEventListener('pointermove', move);
      group.addEventListener('pointerup', finish);
      group.addEventListener('pointercancel', finish);
    });
    group.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); activate(); } });

    const shape = document.createElementNS('http://www.w3.org/2000/svg', node.shape === 'rect' ? 'rect' : 'ellipse');
    shape.classList.add('daily-chain-node-shape');
    if (node.shape === 'rect') {
      shape.setAttribute('x', node.x - node.w/2); shape.setAttribute('y', node.y - node.h/2);
      shape.setAttribute('width', node.w); shape.setAttribute('height', node.h); shape.setAttribute('rx', .7);
    } else {
      shape.setAttribute('cx', node.x); shape.setAttribute('cy', node.y);
      shape.setAttribute('rx', node.w/2); shape.setAttribute('ry', node.h/2);
    }
    shape.setAttribute('fill', heat.fill); shape.setAttribute('stroke', heat.stroke);
    group.appendChild(shape);

    const lines = chainLabelLines(node.name);
    const labelSize = (node.name || '').length >= 7 ? 1.03 : 1.22;
    lines.forEach((line, index) => {
      const text = document.createElementNS('http://www.w3.org/2000/svg','text');
      text.classList.add('daily-chain-node-label');
      text.setAttribute('x', node.x);
      text.setAttribute('y', node.y - (node.retWeighted == null ? 0 : .58) + (index - (lines.length-1)/2) * 1.15);
      text.style.fontSize = `${labelSize}px`; text.textContent = line; group.appendChild(text);
    });
    const ret = document.createElementNS('http://www.w3.org/2000/svg','text');
    ret.classList.add('daily-chain-node-ret'); ret.setAttribute('x',node.x); ret.setAttribute('y',node.y + Math.min(1.25,node.h*.25));
    ret.style.fill = node.retWeighted == null ? '#a8a29e' : node.retWeighted >= 0 ? '#b91c1c' : '#047857';
    ret.textContent = chainPct(node.retWeighted); group.appendChild(ret);
    svg.appendChild(group);
  });
  renderDailyChainDetail(byId.get(dailyChainActiveId));
}
renderDailyChainGraph();

function renderMarketTreemap() {
  const panel = document.getElementById('dailyChainPanel');
  const items = stocks.filter(s => s.l1 !== '指数' && Number.isFinite(s.market_cap) && s.market_cap > 0 && Number.isFinite(s.tree_pct_chg));
  const esc = value => String(value ?? '').replace(/[&<>\"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[ch]));
  const groupBy = (rows, key) => {
    const map = new Map();
    rows.forEach(row => {
      const name = row[key] || '未分类';
      if (!map.has(name)) map.set(name, []);
      map.get(name).push(row);
    });
    return [...map].map(([name, children]) => {
      const value = children.reduce((sum,row) => sum + row.market_cap, 0);
      const weightedReturn = children.reduce((sum,row) => sum + row.market_cap * row.tree_pct_chg, 0) / value;
      return {name, children, value, weightedReturn};
    }).sort((a,b) => b.value-a.value);
  };
  const binaryLayout = (nodes, x, y, w, h) => {
    if (!nodes.length) return [];
    if (nodes.length === 1) return [{node:nodes[0],x,y,w,h}];
    const total = nodes.reduce((sum,node) => sum + node.value, 0);
    let running = 0, split = 1;
    for (let i=0;i<nodes.length-1;i++) {
      running += nodes[i].value;
      split = i+1;
      if (running >= total/2) break;
    }
    const first = nodes.slice(0,split), second = nodes.slice(split);
    const firstValue = first.reduce((sum,node) => sum + node.value, 0);
    const ratio = firstValue / total;
    if (w >= h) {
      const w1 = w * ratio;
      return binaryLayout(first,x,y,w1,h).concat(binaryLayout(second,x+w1,y,w-w1,h));
    }
    const h1 = h * ratio;
    return binaryLayout(first,x,y,w,h1).concat(binaryLayout(second,x,y+h1,w,h-h1));
  };
  const heat = value => {
    if (!Number.isFinite(value) || value === 0) return '#e8e5df';
    const alpha = .18 + Math.min(Math.abs(value),10)/10*.68;
    return value > 0 ? 'rgba(220,64,64,'+alpha+')' : 'rgba(42,157,105,'+alpha+')';
  };
  const W=1180,H=620;
  let svg = '';
  const leafGroups = new Map();
  let leafIndex = 0;
  const l1Groups = groupBy(items,'l1');
  binaryLayout(l1Groups,0,0,W,H).forEach(l1r => {
    svg += '<rect class="treemap-l1" x="'+l1r.x+'" y="'+l1r.y+'" width="'+l1r.w+'" height="'+l1r.h+'"/>';
    if (l1r.w > 70 && l1r.h > 30) svg += '<text class="treemap-group-label" x="'+(l1r.x+7)+'" y="'+(l1r.y+16)+'">'+esc(l1r.node.name)+' '+(l1r.node.weightedReturn>0?'+':'')+l1r.node.weightedReturn.toFixed(2)+'% · '+(l1r.node.value/10000).toFixed(2)+'万亿</text>';
    const l1Head = l1r.h > 45 ? 21 : 0;
    const l2Groups = groupBy(l1r.node.children,'l2');
    binaryLayout(l2Groups,l1r.x+3,l1r.y+l1Head,l1r.w-6,l1r.h-l1Head-3).forEach(l2r => {
      svg += '<rect class="treemap-l2" x="'+l2r.x+'" y="'+l2r.y+'" width="'+l2r.w+'" height="'+l2r.h+'"/>';
      if (l2r.w > 75 && l2r.h > 28) svg += '<text class="treemap-sub-label" x="'+(l2r.x+5)+'" y="'+(l2r.y+11)+'">'+esc(l2r.node.name)+' '+(l2r.node.weightedReturn>0?'+':'')+l2r.node.weightedReturn.toFixed(2)+'%</text>';
      const l2Head = l2r.h > 38 ? 15 : 0;
      const l3Groups = groupBy(l2r.node.children,'l3');
      binaryLayout(l3Groups,l2r.x+1,l2r.y+l2Head,l2r.w-2,l2r.h-l2Head-1).forEach(l3r => {
        const pct=l3r.node.weightedReturn, cx=l3r.x+l3r.w/2, cy=l3r.y+l3r.h/2;
        const key = 'leaf-'+leafIndex++;
        leafGroups.set(key,{l1:l1r.node.name,l2:l2r.node.name,l3:l3r.node.name,...l3r.node});
        svg += '<g class="treemap-leaf" tabindex="0" role="button" data-treemap-key="'+esc(key)+'" aria-label="查看 '+esc(l3r.node.name)+' 目录个股"><title>'+esc(l1r.node.name)+' / '+esc(l2r.node.name)+' / '+esc(l3r.node.name)+' | '+l3r.node.children.length+'只 | 合计市值 '+l3r.node.value.toFixed(1)+'亿 | 市值加权 '+(pct>0?'+':'')+pct.toFixed(2)+'%</title><rect class="treemap-cell" fill="'+heat(pct)+'" x="'+l3r.x+'" y="'+l3r.y+'" width="'+l3r.w+'" height="'+l3r.h+'"/>';
        if (l3r.w > 42 && l3r.h > 25) svg += '<text class="treemap-stock-name" x="'+cx+'" y="'+(cy-2)+'">'+esc(l3r.node.name)+'</text><text class="treemap-stock-pct" x="'+cx+'" y="'+(cy+11)+'">'+(pct>0?'+':'')+pct.toFixed(2)+'%</text>';
        svg += '</g>';
      });
    });
  });
  panel.className = 'treemap-panel';
  const l3Count = l1Groups.reduce((total,l1) => total + groupBy(l1.children,'l2').reduce((sum,l2) => sum + groupBy(l2.children,'l3').length,0),0);
  panel.innerHTML = '<div class="treemap-head"><div class="treemap-title">TMT目录当日涨跌幅棋盘图</div><div class="treemap-meta">最小单位 = 三级目录 · 面积 = 目录内股票总市值 · 点击格子查看个股<br>涨跌幅 = 内部个股按市值加权平均 · 覆盖 '+items.length+' 只股票 / '+l3Count+' 个三级目录</div></div><div class="treemap-wrap"><svg class="treemap-svg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="按一级二级三级目录分区的市值加权当日涨跌幅棋盘图">'+svg+'</svg></div><div class="treemap-detail empty" id="treemapDetail">点击任一三级目录格子，查看该目录下具体个股的今日表现。</div>';

  const detail = panel.querySelector('#treemapDetail');
  let activeLeaf = null;
  const num = value => Number.isFinite(value) ? value.toFixed(2) : '—';
  const signedPct = value => Number.isFinite(value) ? (value > 0 ? '+' : '')+value.toFixed(2)+'%' : '—';
  const showDetail = (key, leaf) => {
    if (!leaf) return;
    if (activeLeaf) activeLeaf.classList.remove('active');
    activeLeaf = leaf;
    leaf.classList.add('active');
    const group = leafGroups.get(key);
    if (!group) return;
    const ordered = group.children.slice().sort((a,b) => (b.tree_pct_chg ?? -Infinity) - (a.tree_pct_chg ?? -Infinity));
    const upCount = ordered.filter(row => row.tree_pct_chg > 0).length;
    const downCount = ordered.filter(row => row.tree_pct_chg < 0).length;
    const rows = ordered.map(row => '<tr><td><div class="treemap-detail-name">'+esc(row.name)+'</div><div class="treemap-detail-code">'+esc(row.code)+'</div></td><td class="num"><span class="pct '+(row.tree_pct_chg>0?'up':row.tree_pct_chg<0?'down':'flat')+'">'+signedPct(row.tree_pct_chg)+'</span></td><td class="num">'+(Number.isFinite(row.turn_pct)?num(row.turn_pct)+'%':'—')+'</td><td class="num">'+(Number.isFinite(row.vol_ratio)?num(row.vol_ratio)+'x':'—')+'</td><td class="num">'+(Number.isFinite(row.amt_yi)?num(row.amt_yi):'—')+'</td><td class="num">'+(Number.isFinite(row.market_cap)?num(row.market_cap):'—')+'</td></tr>').join('');
    detail.classList.remove('empty');
    detail.innerHTML = '<div class="treemap-detail-head"><div><div class="treemap-detail-path">'+esc(group.l1)+' / '+esc(group.l2)+' / '+esc(group.l3)+'</div><div class="treemap-detail-sub">个股按今日涨跌幅从高到低排列</div><div class="treemap-detail-chips"><span class="treemap-detail-chip '+(group.weightedReturn>=0?'up':'down')+'">市值加权 '+signedPct(group.weightedReturn)+'</span><span class="treemap-detail-chip">总市值 '+num(group.value)+' 亿</span><span class="treemap-detail-chip">'+ordered.length+' 只</span><span class="treemap-detail-chip up">上涨 '+upCount+'</span><span class="treemap-detail-chip down">下跌 '+downCount+'</span></div></div><button class="treemap-detail-close" type="button" aria-label="关闭目录明细">×</button></div><div class="treemap-detail-table-wrap"><table class="treemap-detail-table"><thead><tr><th>名称</th><th class="num">涨跌幅</th><th class="num">换手率</th><th class="num">量比</th><th class="num">成交额(亿)</th><th class="num">市值(亿)</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
    detail.querySelector('.treemap-detail-close').addEventListener('click',() => {
      activeLeaf.classList.remove('active'); activeLeaf=null;
      detail.className='treemap-detail empty';
      detail.textContent='点击任一三级目录格子，查看该目录下具体个股的今日表现。';
    });
    detail.scrollIntoView({behavior:'smooth',block:'nearest'});
  };
  panel.querySelectorAll('.treemap-leaf').forEach(leaf => {
    const activate = () => showDetail(leaf.dataset.treemapKey,leaf);
    leaf.addEventListener('click',activate);
    leaf.addEventListener('keydown',event => { if (event.key==='Enter' || event.key===' ') { event.preventDefault(); activate(); } });
  });
}
renderMarketTreemap();

function maDot(v) {
  if (v === 1) return '<span class="dot up"></span>';
  if (v === 0) return '<span class="dot down"></span>';
  return '<span class="dot na"></span>';
}

function pctHtml(v) {
  if (v === null || v === undefined) return '<span class="pct flat">—</span>';
  const cls = v > 0 ? 'up' : v < 0 ? 'down' : 'flat';
  const barColor = v > 0 ? 'var(--up)' : v < 0 ? 'var(--down)' : 'var(--border)';
  const halfWidth = Math.min(Math.abs(v) / PCT_BAR_LIMIT, 1) * 50;
  const barStyle = v >= 0
    ? `left:50%;width:${halfWidth}%;background:${barColor};`
    : `right:50%;width:${halfWidth}%;background:${barColor};`;
  return `<div style="display:flex;align-items:center;justify-content:flex-end;gap:6px;">
    <div class="pct-bar-track" title="中心为0；上涨向右、下跌向左；±10%为满格"><div class="pct-bar-fill" style="${barStyle}"></div></div>
    <span class="pct ${cls}" style="min-width:54px;text-align:right;">${v > 0 ? '+' : ''}${v.toFixed(2)}%</span>
  </div>`;
}

function volHtml(s) {
  if (s.vol_ratio === null || s.vol_ratio === undefined) return '<span style="color:var(--text-muted);">—</span>';
  const r = s.vol_ratio;
  const upTag = s.pct_chg !== null && s.pct_chg > 0;
  if (r >= 2) {
    const cls = upTag ? 'up' : 'down';
    const label = upTag ? '放量上涨' : '放量下跌';
    return `<span class="chip ${cls}" style="margin:0;" title="今日成交额为前20日均值的 ${r.toFixed(1)} 倍">${label} ${r.toFixed(1)}x</span>`;
  }
  if (r >= 1.5) {
    return `<span class="chip plain" style="margin:0;" title="今日成交额为前20日均值的 ${r.toFixed(1)} 倍">温和放量 ${r.toFixed(1)}x</span>`;
  }
  return `<span style="color:var(--text-muted);font-size:11px;">${r.toFixed(1)}x</span>`;
}

function ddHtml(s) {
  if (s.is_period_high) return '<span class="tag-newhigh">6/1以来新高</span>';
  if (s.drawdown === null || s.drawdown === undefined) return '<span class="dd-text" style="color:var(--text-muted);">—</span>';
  const dd = s.drawdown;
  const color = dd >= -5 ? 'var(--up)' : dd >= -15 ? 'var(--text)' : dd >= -30 ? 'var(--gold)' : 'var(--down)';
  return `<span class="dd-text" style="color:${color};">${dd.toFixed(2)}%</span>`;
}

function pctChip(s) {
  const cls = s.pct_chg > 0 ? 'up' : s.pct_chg < 0 ? 'down' : 'plain';
  const sign = s.pct_chg > 0 ? '+' : '';
  return `<span class="chip ${cls}">${s.name} ${sign}${s.pct_chg.toFixed(2)}%</span>`;
}

const COMMENTARY_EXCLUDE_L1 = ['软件应用'];
const commentaryPool = stocks.filter(s => !COMMENTARY_EXCLUDE_L1.includes(s.l1));

const withPct = commentaryPool.filter(s => s.pct_chg !== null && s.pct_chg !== undefined);
const recentHighs = commentaryPool.filter(s => s.is_period_high);
const recentLows = commentaryPool.filter(s => s.is_recent_low);
const gainers = withPct.slice().sort((a, b) => b.pct_chg - a.pct_chg).slice(0, 5);
const losers = withPct.slice().sort((a, b) => a.pct_chg - b.pct_chg).slice(0, 5);
const volumePool = commentaryPool.filter(s => s.l1 !== '指数' && s.vol_ratio !== null && s.vol_ratio !== undefined);
const highVolumeAll = volumePool.filter(s => s.vol_ratio >= 1.5).sort((a, b) => b.vol_ratio - a.vol_ratio);
const lowVolumeAll = volumePool.filter(s => s.vol_ratio <= .5).sort((a, b) => a.vol_ratio - b.vol_ratio);
const volumeChip = (s, cls='plain') => `<span class="chip ${cls}">${s.name} ${s.vol_ratio.toFixed(1)}x</span>`;
const summaryChips = (items, renderer, limit=10) => items.length
  ? `<span class="commentary-text">共 ${items.length} 只${items.length > limit ? `，显示前${limit}只：` : '：'}</span>${items.slice(0, limit).map(renderer).join('')}`
  : '<span class="commentary-text">无</span>';

let commentaryHtml = '<div class="commentary-title">今日标的总览</div>';
commentaryHtml += `<div class="commentary-row">
  <div class="commentary-label">6/1以来新高</div>
  <div>${summaryChips(recentHighs, s => `<span class="chip up">${s.name}</span>`, recentHighs.length)}</div>
</div>`;
commentaryHtml += `<div class="commentary-row">
  <div class="commentary-label">7/1以来新低</div>
  <div>${summaryChips(recentLows, s => `<span class="chip down">${s.name}</span>`, recentLows.length)}</div>
</div>`;
commentaryHtml += `<div class="commentary-row">
  <div class="commentary-label">今日涨幅最大</div>
  <div>${gainers.map(pctChip).join('')}</div>
</div>`;
commentaryHtml += `<div class="commentary-row">
  <div class="commentary-label">今日跌幅最大</div>
  <div>${losers.map(pctChip).join('')}</div>
</div>`;
commentaryHtml += `<div class="commentary-row">
  <div class="commentary-label">今日明显放量</div>
  <div>${summaryChips(highVolumeAll, s => volumeChip(s, s.pct_chg >= 0 ? 'up' : 'down'))}</div>
</div>`;
commentaryHtml += `<div class="commentary-row">
  <div class="commentary-label">今日明显缩量</div>
  <div>${summaryChips(lowVolumeAll, s => volumeChip(s, 'plain'))}</div>
</div>`;
commentaryHtml += `<div class="commentary-row"><div class="commentary-label"></div><div class="commentary-text">量能口径：今日成交额 ÷ 前20个交易日平均成交额；明显放量 ≥ 1.5x，明显缩量 ≤ 0.5x。</div></div>`;
document.getElementById('commentary').innerHTML = commentaryHtml;

let sortKey = null, sortAsc = false, filterInd = '', filterText = '';

function getFiltered() {
  return stocks.filter(s => {
    if (filterInd && s.l1 !== filterInd) return false;
    if (filterText) {
      const t = filterText.toLowerCase();
      if (!s.name.toLowerCase().includes(t) && !s.code.toLowerCase().includes(t)) return false;
    }
    return true;
  });
}

function render() {
  const tbody = document.getElementById('tbody');
  let list = getFiltered();

  if (sortKey) {
    list = list.slice().sort((a, b) => {
      let av, bv;
      if (sortKey === 'ma') {
        av = (a.ma_pos['5']||0) + (a.ma_pos['20']||0) + (a.ma_pos['60']||0);
        bv = (b.ma_pos['5']||0) + (b.ma_pos['20']||0) + (b.ma_pos['60']||0);
      } else {
        av = a[sortKey]; bv = b[sortKey];
      }
      if (av === null || av === undefined) av = -Infinity;
      if (bv === null || bv === undefined) bv = -Infinity;
      if (typeof av === 'string') return sortAsc ? av.localeCompare(bv) : bv.localeCompare(av);
      return sortAsc ? av - bv : bv - av;
    });
    let html = '';
    let seq = 1;
    list.forEach(s => { html += rowHtml(s, seq++); });
    tbody.innerHTML = html;
    return;
  }

  // 未排序：按一级、二级行业分组，保持源表中的首次出现顺序
  let html = '';
  let seq = 1;
  const groups = {};
  list.forEach(s => { (groups[s.l1] = groups[s.l1] || []).push(s); });
  DATA.l1_order.forEach(l1 => {
    const items = groups[l1];
    if (!items || !items.length) return;
    html += `<tr class="group-row"><td colspan="11">${l1}（${items.length}）</td></tr>`;
    const subgroups = {};
    const l2Order = [];
    items.forEach(s => {
      const l2 = s.l2 || l1;
      if (!subgroups[l2]) {
        subgroups[l2] = [];
        l2Order.push(l2);
      }
      subgroups[l2].push(s);
    });
    l2Order.forEach(l2 => {
      const subitems = subgroups[l2];
      html += `<tr class="subgroup-row"><td colspan="11">${l2}<span class="subgroup-count">（${subitems.length}）</span></td></tr>`;
      subitems.forEach(s => { html += rowHtml(s, seq++); });
    });
  });
  tbody.innerHTML = html;
}

function rowHtml(s, seq) {
  const maDots = maDot(s.ma_pos['5']) + maDot(s.ma_pos['20']) + maDot(s.ma_pos['60']);
  const priceTags = `${s.is_period_high ? '<span class="tag-newhigh" title="最新收盘价创2026-06-01以来新高">新高</span>' : ''}${s.is_recent_low ? '<span class="tag-newlow" title="最新收盘价创2026-07-01以来新低">新低</span>' : ''}`;
  let lagNote = '';
  if (s.lag_reason === '停牌') {
    lagNote = `<span class="tag-suspended" title="最新数据日期为 ${s.as_of}，此后无成交，判断为停牌">停牌</span>`;
  } else if (s.as_of !== DATA.latest_date) {
    lagNote = `<span title="该标的最新数据日期为 ${s.as_of}，晚于本页基准交易日（${s.lag_reason || '假期未同步'}）" style="color:var(--gold);cursor:help;">*</span>`;
  }
  return `<tr>
    <td style="color:var(--text-muted);">${seq}</td>
    <td><div class="name-cell">${s.name}${priceTags}${lagNote}</div><div class="code-cell">${s.code}</div></td>
    <td class="col-industry" style="color:var(--text-secondary);font-size:11px;"><span class="industry-cell"><span>${s.l1}</span>${s.l2 ? `<span class="industry-sub">${s.l2}</span>` : ''}</span></td>
    <td class="num">${pctHtml(s.pct_chg)}</td>
    <td class="num">${s.turn_pct !== null ? s.turn_pct.toFixed(2)+'%' : '—'}</td>
    <td class="num">${s.turn_avg20 !== null ? s.turn_avg20.toFixed(2)+'%' : '—'}</td>
    <td class="num">${volHtml(s)}</td>
    <td class="num">${s.amt_yi !== null ? s.amt_yi.toFixed(2) : '—'}</td>
    <td style="text-align:center;">${maDots}</td>
    <td class="num">${ddHtml(s)}</td>
  </tr>`;
}

document.getElementById('searchBox').addEventListener('input', e => {
  filterText = e.target.value.trim();
  render();
});
indSel.addEventListener('change', e => {
  filterInd = e.target.value;
  render();
});
document.querySelectorAll('thead th[data-key]').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.key;
    if (key === 'idx') { sortKey = null; }
    else if (sortKey === key) { sortAsc = !sortAsc; }
    else { sortKey = key; sortAsc = false; }
    document.querySelectorAll('thead th').forEach(x => x.classList.remove('sorted','asc'));
    if (sortKey) {
      th.classList.add('sorted');
      if (sortAsc) th.classList.add('asc');
    }
    render();
  });
});

render();
</script>
</body>
</html>
