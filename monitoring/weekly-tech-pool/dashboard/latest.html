<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMT周频看板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Serif:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F7F6F3;
  --card: #FFFFFF;
  --border: #E2E0DB;
  --text-primary: #1C1917;
  --text-secondary: #78716C;
  --accent: #2563EB;
  --accent-light: #DBEAFE;
  --positive: #DC2626;
  --negative: #059669;
  --warning: #D97706;
  --font-sans: 'IBM Plex Sans', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
  --font-serif: 'IBM Plex Serif', 'Noto Serif SC', 'Source Han Serif CN', serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 14px; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text-primary);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ─── HEADER ─── */
header {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 20px 40px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
}
header .title {
  font-family: var(--font-serif);
  font-size: 1.5rem;
  font-weight: 600;
  color: var(--text-primary);
  letter-spacing: -0.02em;
}
header .subtitle {
  font-size: 0.8rem;
  color: var(--text-secondary);
  letter-spacing: 0.05em;
  margin-top: 4px;
}
header .date-badge {
  font-size: 0.75rem;
  color: var(--text-secondary);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 3px 10px;
}

/* ─── MAIN ─── */
.main {
  max-width: 1400px;
  margin: 0 auto;
  padding: 28px 40px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 22px 24px;
}
.card-title {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-primary);
}

/* ─── 每周一句话 ─── */
.weekly-summary {
  background: linear-gradient(135deg, #1F4E79 0%, #2C6CA0 100%);
  color: #FFFFFF;
  border: none;
  display: flex;
  align-items: flex-start;
  gap: 16px;
  padding: 20px 26px;
}
.weekly-summary .ws-tag {
  flex: 0 0 auto;
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  background: rgba(255, 255, 255, 0.16);
  padding: 4px 12px;
  border-radius: 4px;
  white-space: nowrap;
  margin-top: 3px;
}
.weekly-summary .ws-text {
  font-family: var(--font-serif);
  font-size: 1.18rem;
  font-weight: 600;
  line-height: 1.65;
  color: #FFFFFF;
}
.weekly-summary .ws-meta {
  font-size: 0.7rem;
  font-weight: 400;
  color: rgba(255, 255, 255, 0.72);
  margin-top: 6px;
}

/* ─── 棋盘图 ─── */
.weekly-treemap-head { display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:10px; }
.weekly-treemap-meta { font-size:0.75rem;color:var(--text-secondary);text-align:right;line-height:1.6; }
.weekly-treemap-wrap { padding:8px;background:#F8F7F4;border:1px solid var(--border);border-radius:8px;overflow:hidden; }
.weekly-treemap-svg { width:100%;height:auto;display:block;background:#fff; }
.weekly-treemap-l1 { fill:none;stroke:#fff;stroke-width:5;pointer-events:none; }
.weekly-treemap-l2 { fill:none;stroke:#fff;stroke-width:2.5;pointer-events:none; }
.weekly-treemap-cell { stroke:#fff;stroke-width:1; }
.weekly-treemap-group-label { fill:#243548;font-weight:850;font-size:12px;paint-order:stroke;stroke:#fff;stroke-width:3px;pointer-events:none; }
.weekly-treemap-sub-label { fill:#4F5963;font-weight:750;font-size:9px;paint-order:stroke;stroke:#fff;stroke-width:3px;pointer-events:none; }
.weekly-treemap-name { fill:#17212B;font-weight:750;font-size:10px;text-anchor:middle;pointer-events:none; }
.weekly-treemap-pct { fill:#17212B;font-size:9px;text-anchor:middle;pointer-events:none; }

/* ─── 棋盘图下钻 ─── */
.weekly-treemap-leaf { cursor: pointer; }
.weekly-treemap-leaf:hover .weekly-treemap-cell { stroke:#57534E;stroke-width:1.5px; }
.weekly-treemap-leaf.selected .weekly-treemap-cell { stroke:#1C1917;stroke-width:2.5px; }
.treemap-detail { display: none; margin-top: 14px; }
.treemap-detail.show { display: block; }
.treemap-detail-head { font-size: 0.82rem; font-weight: 600; color: var(--text-primary); margin-bottom: 8px; }
.treemap-detail-head .hint { font-weight: 400; font-size: 0.72rem; color: var(--text-secondary); }

/* ─── 个股本周信息汇总 ─── */
.stock-summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 14px; }
.ss-col { border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px; background: #FBFBF9; }
.ss-col-title { font-size: 0.8rem; font-weight: 600; color: var(--text-primary); margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.ss-col-title .sub { font-weight: 400; font-size: 0.7rem; color: var(--text-secondary); margin-left: 6px; }
.ss-item { display: flex; align-items: center; gap: 8px; padding: 3.5px 0; font-size: 0.78rem; }
.ss-rank { width: 16px; text-align: center; font-size: 0.7rem; color: var(--text-secondary); flex-shrink: 0; }
.ss-name { flex: 1; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ss-code { color: var(--text-secondary); font-size: 0.68rem; flex-shrink: 0; }
.ss-val { font-weight: 600; flex-shrink: 0; }
.ss-divider { border-top: 1px dashed var(--border); margin: 8px 0; }
.ss-empty { font-size: 0.75rem; color: var(--text-secondary); padding: 8px 0; }
.up { color: var(--positive); }
.down { color: var(--negative); }
.stock-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
.stock-table th { text-align: left; color: var(--text-secondary); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.stock-table td { padding: 6px 8px; border-bottom: 1px solid var(--border); }
.stock-table tr:last-child td { border-bottom: none; }
.stock-table td.num, .stock-table th.num { text-align: right; }
.stock-table .hl-52w { display: inline-block; font-size: 0.62rem; color: #fff; background: #B45309; border-radius: 3px; padding: 1px 5px; font-weight: 600; }
@media (max-width: 900px) { .stock-summary-grid { grid-template-columns: 1fr; } }

/* ─── 海外科技龙头 ─── */
.os-section-title {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text-secondary);
  margin: 16px 0 8px;
}
.os-section-title:first-child { margin-top: 0; }
.os-leaders { display: flex; flex-wrap: wrap; gap: 10px; }
.os-leader {
  flex: 1 1 0;
  min-width: 92px;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 12px;
  background: #FAFAF8;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.os-leader .name { font-size: 0.78rem; font-weight: 600; color: var(--text-primary); }
.os-leader .pct { font-size: 1.05rem; font-weight: 700; font-family: var(--font-serif); line-height: 1; }
.os-leader .cap { font-size: 0.66rem; color: var(--text-secondary); }
.os-leader .pct.up { color: var(--positive); }
.os-leader .pct.down { color: var(--negative); }

.os-compare {
  margin-top: 14px;
  padding: 10px 14px;
  border-left: 3px solid var(--accent);
  background: var(--accent-light);
  border-radius: 6px;
  font-size: 0.84rem;
  color: #1E3A8A;
  line-height: 1.6;
}
.os-compare b { font-weight: 700; }
.os-warn {
  color: #9A3412;
  background: #FEF3C7;
  border: 1px solid #FCD34D;
  border-radius: 4px;
  padding: 1px 6px;
  font-size: 0.72rem;
  font-weight: 600;
}

.os-cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.os-cat {
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 10px;
  background: #FAFAF8;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.os-cat .cname { font-size: 0.72rem; font-weight: 600; color: var(--text-primary); }
.os-cat .cpct { font-size: 0.95rem; font-weight: 700; font-family: var(--font-serif); line-height: 1.1; }
.os-cat .cmeta { font-size: 0.64rem; color: var(--text-secondary); }
.os-cat .cpct.up { color: var(--positive); }
.os-cat .cpct.down { color: var(--negative); }

.os-note {
  margin-top: 12px;
  font-size: 0.7rem;
  color: var(--text-secondary);
  line-height: 1.6;
}

/* ─── 科技大事时间线 ─── */
.timeline-card { grid-column: 1 / -1; }
.timeline-header {
  display: flex;
  align-items: center;
  gap: 12px;
  background: #1F4E79;
  color: #FFFFFF;
  padding: 9px 16px;
  border-radius: 4px;
  font-weight: 600;
  font-size: 0.9rem;
  margin-bottom: 14px;
}
.timeline-range {
  font-size: 0.72rem;
  font-weight: 400;
  color: rgba(255, 255, 255, 0.85);
  background: rgba(255, 255, 255, 0.14);
  padding: 2px 8px;
  border-radius: 3px;
}
.tl-list { padding: 2px 4px; }
.tl-week { position: relative; padding-left: 30px; }
.tl-rail {
  position: absolute;
  left: 10px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: #E2E8F0;
}
.tl-week:last-child .tl-rail { height: 14px; bottom: auto; }
.tl-dot {
  position: absolute;
  left: 4px;
  top: 5px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #fff;
  border: 3px solid #1F4E79;
  box-sizing: border-box;
  z-index: 1;
}
.tl-week.kind-outlook .tl-dot { border-color: #B45309; }
.tl-week-head {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  user-select: none;
  padding: 7px 12px;
  border-radius: 6px;
  background: #F8FAFC;
  border: 1px solid #E2E8F0;
  margin-bottom: 6px;
}
.tl-week-head:hover { background: #F1F5F9; }
.tl-kind {
  font-size: 0.7rem;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 3px;
  color: #fff;
  line-height: 1.5;
}
.kind-recap .tl-kind { background: #1F4E79; }
.kind-outlook .tl-kind { background: #B45309; }
.tl-label { font-weight: 600; font-size: 0.88rem; color: var(--text-primary); }
.tl-toggle { margin-left: auto; color: var(--text-secondary); font-size: 0.8rem; transition: transform .18s; }
.tl-week.open .tl-toggle { transform: rotate(180deg); }
.tl-week-body {
  display: none;
  padding: 2px 4px 8px 12px;
  font-size: 0.85rem;
  line-height: 1.75;
  color: var(--text-primary);
}
.tl-week.open .tl-week-body { display: block; }
.tl-week-body p { margin: 0 0 10px; }
.tl-week-body p.lead { font-size: 0.9rem; font-weight: 500; }
.tl-week-body h2 { font-size: 0.85rem; font-weight: 600; margin: 14px 0 6px; color: #1F4E79; }
.tl-week-body h2:first-of-type { margin-top: 4px; }
.tl-week-body ul { padding-left: 22px; margin: 6px 0 10px; }
.tl-week-body li { margin: 5px 0; }
.tl-week-body .hl { color: #C0392B; font-weight: 600; }
/* 时间线内的卖方解读折叠块 */
.tl-sellside {
  margin-top: 12px;
  border: 1px solid #F1C40F;
  border-radius: 6px;
  background: #FFFDF5;
  overflow: hidden;
}
.tl-sellside-head {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  user-select: none;
  padding: 8px 12px;
  font-size: 0.82rem;
  font-weight: 600;
  color: #8A6D00;
  background: #FFF9E6;
}
.tl-sellside-head:hover { background: #FFF3CD; }
.tl-sellside-icon { font-size: 0.9rem; }
.tl-sellside-toggle { margin-left: auto; transition: transform .18s; color: #B7950B; font-size: 0.8rem; }
.tl-sellside.open .tl-sellside-toggle { transform: rotate(180deg); }
.tl-sellside-body {
  display: none;
  padding: 10px 14px 12px;
  font-size: 0.82rem;
  line-height: 1.75;
  border-top: 1px solid #F1C40F;
}
.tl-sellside.open .tl-sellside-body { display: block; }
.tl-sellside-concl {
  margin: 0 0 10px;
  padding: 8px 12px;
  background: #FFF3CD;
  border-left: 3px solid #F1C40F;
  border-radius: 4px;
  font-weight: 500;
  color: #6B5500;
}
.tl-sellside-body h2 { font-size: 0.82rem; font-weight: 600; margin: 12px 0 6px; color: #8A6D00; }
.tl-sellside-body h2:first-of-type { margin-top: 2px; }
.tl-sellside-body ul { padding-left: 20px; margin: 4px 0 8px; }
.tl-sellside-body li { margin: 4px 0; }
.tl-sellside-body table {
  width: 100%;
  border-collapse: collapse;
  margin: 8px 0;
  font-size: 0.78rem;
}
.tl-sellside-body th, .tl-sellside-body td {
  border: 1px solid #EADCA8;
  padding: 6px 8px;
  text-align: left;
  vertical-align: top;
}
.tl-sellside-body th { background: #FFF3CD; font-weight: 600; color: #6B5500; white-space: nowrap; }
.tl-sellside-body td { background: #FFFEF8; }
.tl-sellside-src {
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px dashed #EADCA8;
  font-size: 0.72rem;
  color: #A0894A;
}
.tl-sellside-body .hl { color: #C0392B; font-weight: 600; }
</style>

<style id="weekly-heading-unified">.hub-nav{padding:30px 40px 0;background:var(--card)}header{padding-top:0;gap:16px;flex-wrap:wrap}header .title{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:27px;line-height:1.6;font-weight:700;letter-spacing:-.03em;color:#1c1917}header .title span{color:#1b3a5c}@media(max-width:900px){.hub-nav{padding:22px 18px 0}header{padding-left:18px;padding-right:18px}}</style>

<div class="hub-nav"><a class="back-to-main" href="../../../main-dashboard.html">← 回到主看板</a></div>
<header>
  <div>
    <div class="title">TMT<span>周频看板</span></div>
    <div class="subtitle">TMT 目录周涨跌幅棋盘图 · 数据来自 TMT周度涨跌幅.xlsx</div>
  </div>
  <span class="date-badge" id="dateBadge">—</span>
</header>

<div class="main">
  <!-- 每周一句话 -->
  <div class="card weekly-summary" id="weeklySummaryCard">
    <span class="ws-tag">每周一句话</span>
    <div>
      <div class="ws-text" id="weeklySummaryText">—</div>
      <div class="ws-meta" id="weeklySummaryMeta"></div>
    </div>
  </div>

  <div class="card" id="marketValueCard">
    <div class="weekly-treemap-head">
      <div class="card-title">TMT目录周涨跌幅棋盘图</div>
      <div class="weekly-treemap-meta" id="weeklyTreemapMeta"></div>
    </div>
    <div class="weekly-treemap-wrap">
      <svg id="weeklyTreemapSvg" class="weekly-treemap-svg" viewBox="0 0 1180 620" role="img" aria-label="按一级二级三级目录分区的市值加权周涨跌幅棋盘图"></svg>
    </div>
    <div class="treemap-detail" id="treemapDetail">
      <div class="treemap-detail-head" id="treemapDetailHead"></div>
      <div id="treemapDetailBody"></div>
    </div>
  </div>

  <!-- 个股本周信息汇总 -->
  <div class="card">
    <div class="card-title">个股本周信息汇总</div>
    <div class="stock-summary-grid">
      <div class="ss-col">
        <div class="ss-col-title">涨跌幅最大<span class="sub">红涨 / 绿跌</span></div>
        <div id="moversList"></div>
      </div>
      <div class="ss-col">
        <div class="ss-col-title">放量最明显<span class="sub">量比 = 本周成交额 ÷ 前4周均值</span></div>
        <div id="volumeList"></div>
      </div>
      <div class="ss-col">
        <div class="ss-col-title">52周收盘新高<span class="sub">周收盘价口径</span></div>
        <div id="highsList"></div>
      </div>
    </div>
  </div>

  <!-- 海外科技龙头 -->
  <div class="card" id="overseasCard">
    <div class="card-title">海外科技龙头 · 外盘锚</div>
    <div class="os-section-title">核心龙头（市值 Top 12 · 单位：亿美元）</div>
    <div class="os-leaders" id="osLeaders"></div>
    <div class="os-compare" id="osCompare"></div>
    <div class="os-section-title">产业链分类全景（等权平均）</div>
    <div class="os-cats" id="osCats"></div>
    <div class="os-note" id="osNote"></div>
  </div>

  <!-- 科技大事时间线 -->
  <div class="card timeline-card">
    <div class="timeline-header">
      科技大事时间线
      <span class="timeline-range" id="timelineRange"></span>
    </div>
    <div class="tl-list" id="timelineList"></div>
  </div>
</div>

户验证**，成为展会核心看点与下一代量产前夜。[1][2] Citi展会团进一步给出节奏判断：**800G仍是2026年主流、1.6T快速爬坡，合计需求至2027年或约2亿只**；NPO目标**27年下半年小批量量产**，CPO受良率/供应链挑战大致**尚需1–2年**。 兴证与民生电子在会后也强调：**1.6T商业化“元年”确立**，NPO/CPO/2.4T/3.2T等未来技术加速演进。[3]\n\n- **硅光（SiPh）进入“黄金期”，但400G/lane为关键门槛**：卖方普遍认为**硅光将在1.6T时代渗透率抬升**，凭借CMOS兼容与集成度在中短距仍占主导；但**向单通道400G演进的物理与器件瓶颈**使其需与**TFLN等新材料异质融合**以兼顾带宽、线性与能效。[6][7][8] GS与野村亦提示**400G/lane是下一代硅光调制的核心挑战**，需材料与工艺协同突破。[8]\n\n- **TFLN（薄膜铌酸锂）成高性能场景的“最强调制层”**：在LPO/CPO/高速相干等对**高线性/低驱动/高带宽**敏感的架构中，TFLN与硅光异质集成被多家卖方视为**1.6T/3.2T的关键使能**（现有商业器件带宽>100GHz、IMDD与相干TxPIC产品化能力已验证）。**LPO部署被预计在2026年达百万级**，为高线性调制技术打开更明确窗口。[9][7] 浙商与多家卖方在材料环节强调**上游8英寸铌酸锂晶圆放量与TFLN产业化节奏**将决定渗透速度。[10]\n\n- **LPO（线性可插拔）短距先行、功耗优势突出**：LPO弱化DSP/重定时后更依赖**调制器线性度与插损**，与TFLN匹配度高；卖方普遍认为**LPO保留可插拔形态、优先落地AI集群短距互联**，与可插拔主线并行推进。[9] 下图为800G LPO产品形态示意。[11]  \n![](https://content-collection-rb.oss-cn-beijing.aliyuncs.com/document_parse/2026/09/09/4964f788-ac2d-11f1-88f4-5254001e6ba8/4964f788-ac2d-11f1-88f4-5254001e6ba8_1788944593/auto/images/cb9c09b1a8ccb938177766d1d9377eae3da0e4184259484387f01160c383e338.jpg \"800G LPO 光模块产品形态\") [11]\n\n- **NPO/CPO/XPO并行推进：NPO近中期放量、CPO中长期主导**：多家卖方与厂商共识为：**NPO被视为通向CPO的桥接路线**，兼具带宽密度与可制造性，**预计27年下半年起量**、28年扩大；**CPO真正大规模商用尚需1–2年**，3.2T时代开启渗透，最终占据主导，但短中期与可插拔并存。 中际旭创管理层亦强调**可插拔（Scale-out）+NPO/CPO（Scale-up）+跨机房相干/OCS（Scale-across）多架构长期共存**。 下图展示**3.2T世代前后Pluggable/NPO/CPO份额演进**的方向性判断。  \n![](https://content-collection-rb.oss-cn-beijing.aliyuncs.com/document_parse/2026/09/09/fea5a08c-abf8-11f1-acf9-5254002b4059/fea5a08c-abf8-11f1-acf9-5254002b4059_1788922133/auto/images/7173bb90a853fd4b543f39495d9b5f1b81731ed303f52190fbef08717f62c68c.jpg \"CPO 与可插拔光模块在 3.2T 世代前仍将共存，3.2T 之后 CPO 渗透率有望进一步提升\") \n\n- **架构维度的Scale-up/Scale-out协同演进**：卖方指出AI集群由**单机柜向跨机柜Scale-up**扩展，带动**机柜内/跨机柜**对NPO/CPO等方案需求；同时**Scale-out跨机房**需要相干与OCS全光交换以降低OEO开销，满足低时延与能效的动态调度。[1][12] Coherent在展会中展示**6.4T CPO、1.6T VCSEL NPO、12.8T XPO与C+L全频谱OLS/OCS**，强化Scale-Up/Across系统解法。[1]\n\n- **关键瓶颈：DSP最紧、200G EML/CW光源偏紧，上游材料与制造设备随之受益**：卖方一致强调**高端DSP供给最紧**，**200G EML因1.6T需求旺盛处于短缺**；**200mW+ CW激光器**与**InP衬底**供需仍受海外龙头牵引，国产链条在加速导入与扩产；**FAU/MPO、测试设备**在速率升级与NPO/CPO推进下**量价齐升**。[13][14] 多家纪要亦提到**DSP下单量持续增长、测试设备由800G升级到1.6T单通道200G**，订单兑现明显。[3]\n\n- **通道速率从100G/lane向200G/lane过渡，迈向400G/lane**：卖方认为**200G/lane是当前升级主线**（1.6T/3.2T），未来3.2T若维持8通道将**逼近400G/lane**能力边界，对硅光调制/材料/封装提出更高要求。[9][15] 从英伟达GPU迭代时间轴可见网络速率配比正随平台演进迈向**1.6T/3.2T**。[16]\n\n- **会场实证与Demo**：多家厂商展出**6.4T NPO/3.2T CPO/1.6T全套**方案，NPO去DSP架构、32x212.5G PAM4电气接口、4xMPO16收发接口、单模500m传输等工程参数公开呈现；可见**NPO功耗/密度优势与工程化可行性**。[17] Marvell等CPO光引擎样机亦集中亮相（见下图），印证**高密度共封装**的产业推进路径。[18]  \n![](https://content-collection-rb.oss-cn-beijing.aliyuncs.com/document_parse/2026/09/09/4964f788-ac2d-11f1-88f4-5254001e6ba8/4964f788-ac2d-11f1-88f4-5254001e6ba8_1788944593/auto/images/defdd8d7489e21daf46b632c81b55e316cfe13713ffe31a5605d2afa499c5433.jpg \"Marvell CPO 光引擎实物\") [18]\n\n## 2. 卖方普遍提及的核心受益标的与推荐逻辑\n\n- **中际旭创（Innolight）**：  \n  - 逻辑：全球光互连龙头，**800G/1.6T双驱放量、硅光渗透与高端新品（2.4T/3.2T、NPO/XPO）前瞻布局**，供应链锁定与规模化能力支撑**毛利率维持高位（海外800G/1.6T普遍45%+）**；管理层强调**可插拔与NPO/CPO长期并存**与测试/封装平台通用化的**产能灵活切换**。[19]  \n  - 业绩与产能：26H1光模块销量1,899万只、毛利率46.6%，Q2环比净利+38%（1.6T放量/硅光渗透/规模效应）；长期锁料与高CapEx确保关键物料与扩产，**新增产能预计27年起集中释放**。  \n  - 多家卖方**“买入/重点推荐”**并上调远期增速预期。[20][21][22]\n\n- **新易盛（Eoptolink）**：  \n  - 逻辑：**800G/1.6T高端光模块**放量主线的核心受益者；展会与多份周报/晨会上被列入**周度/年度重点推荐**组合。[2][20][21][4]  \n  - 行业驱动：**1.6T规模化交付**带来ASP与毛利结构改善，技术/产能与客户导入节奏优势受益于**26H2–27年需求高峰**。[23]\n\n- **天孚通信（TFC）**：  \n  - 逻辑：**FAU等无源器件**在高密度互联下**通道数与规格提升、价值量膨胀**，随**NPO/CPO产业化**进入scale-up增量市场；TFC亦在**被动+主动链条**扩产与海外交付布局。[13][20]  \n  - 卖方一致将其作为**CPO/NPO核心零部件龙头**重点推荐。[24][22]\n\n- **光迅科技（Accelink）**：  \n  - 逻辑：展出**800G L-Band OSFP ZR/ZR+相干模块**与**6.4T NPO**等产品，**自研器件+规模化能力**夯实**相干/高速直调**全栈；卖方将其纳入**光模块&光器件**重点组合。[17][20]\n\n- **源杰科技（高端激光/光芯片）**、**太辰光/光库科技/致尚科技/长盈通（无源/光纤/特种光纤）**：  \n  - 逻辑：**200G EML/CW激光器、保偏与特种光纤、FAU/MPO**等**上游核心器件与材料**需求强劲、国产替代窗口打开；多家卖方**联合推荐**并提示**InP衬底与光纤供需紧平衡**的结构性机会。[20][24][25][13][2]\n\n- **设备与测试（联讯仪器、罗博特科、科瑞技术等）**：  \n  - 逻辑：**1.6T/3.2T速率升级与NPO/CPO先进封装**驱动**耦合、固晶、测试**设备需求高景气；国内测试设备厂商**从800G向1.6T 200G/lane升级**，订单兑现提速。[14][3]\n\n- **材料/晶圆与TFLN供应链（天通股份等）**：  \n  - 逻辑：**8英寸铌酸锂单晶/晶圆量产**，受益于**TFLN在LPO/CPO/相干**的率先渗透与**晶圆级规模制造**推进；卖方将**TFLN产业化速度**视为超预期来源之一。[9][10]\n\n- 其他产业链受益方向（选摘）：  \n  - **OCS全光交换**及**AIDC液冷**与**交换机/PCB**配套，作为“AI+出海+卫星”长期主线中的**高景气分支**被多家卖方建议跟踪配置。[12][20]\n\n为便于对照，核心标的与逻辑要点小结如下（节选）：\n\n| 细分方向 | 卖方共识/逻辑 | 代表标的 |\n| --- | --- | --- |\n| 800G/1.6T高速光模块龙头 | 1.6T规模放量+硅光渗透+高端新品前瞻，海外订单锁定与高毛利结构确立 | 中际旭创、新易盛[19][20][23] |\n| NPO/CPO核心无源器件 | FAU通道/规格提升，NPO/CPO产业化带来scale-up增量，价值量攀升 | 天孚通信、蘅东光、太辰光、光库科技[13][20][2] |\n| 高端光芯片/激光器 | 200G EML/CW激光器供给偏紧、国产化提速，InP链条景气 | 源杰科技、（光迅亦布局）[20][25] |\n| 测试/封装设备 | 速率升级+NPO/CPO先进封装→耦合/测试需求高景气 | 联讯仪器、罗博特科等[14] |\n| TFLN材料链 | LPO/CPO/相干率先应用，8英寸铌酸锂晶圆放量 | 天通股份[9][10] |\n\n## 3. 卖方对后续“光通信与算力硬件”行情的判断与分歧\n\n- **共识判断：基本面高景气延续，H2’26—2027为1.6T放量与新架构验证共振期**  \n  - 行业层面：卖方持续**看好AI基础设施**驱动下的光通信高景气，认为**1.6T进入批量上量、NPO/CPO验证加速**，**龙头份额提升/毛利结构优化**将延续到2027年。[4][23][26][27][28] 北美CSP CapEx与国内一体化算力网建设同步加码，**网络带宽/低时延/可靠性**指标持续抬升，配套**400G以上传输技术**与数据中心互联方案扩容升级。[29][30]  \n  - 子板块表现：2026H1中上游**光模块/光器件、GPU/ASIC、ICT设备**收入高增，光纤光缆景气提升，验证**上游算力相关板块的高景气度**。[31]\n\n- **结构性分歧一：短期交易与中长期配置的权衡**  \n  - 部分卖方提示短期板块或进入**多行业轮动**、**估值与情绪波动**阶段，建议把握龙头回调的**结构性配置机会**。[5][4]  \n  - 亦有卖方维持对通信行业整体“**同步大市**/估值高分位”的审慎评级，同时在行业内**精选高景气子赛道与龙头**（光模块/光器件/光芯片/光纤）作攻守平衡。[32][33][34]\n\n- **结构性分歧二：CPO/NPO商用节奏与渗透路径**  \n  - **谨慎派**（Citi）：**NPO**预计**27H2**小批量、28年扩大；**CPO**大规模商用仍需**1–2年**，3.2T时代开启渗透，**三路线并存**且向更高密度演进。  \n  - **积极派**（展前/会中）：多家卖方将**NPO/CPO**列为**本届展会最重要看点**，强调**6.4T/12.8T光引擎**与多种封装组合的工程推进，产业链**设备与材料环节同频迭代**。  \n  - 结论：分歧集中在**量产时间窗与放量斜率**，但对中长期**CPO成为终局主导**的方向基本一致（见上图）。\n\n- **结构性分歧三：价格/供给与盈利中枢**  \n  - **ASP与供需**：Citi预计**800G ASP 2027年小幅下行**、**1.6T ASP约为800G的2倍**且价格韧性更强；**2027年1.6T或存在约25%供给缺口**。龙头通过**DSP长协锁定与大额备货**保持先发优势。  \n  - **瓶颈缓释节奏**：多家卖方提示**DSP、EML、CW光源、mSAP/电容**等零部件瓶颈预计**至27H2才明显改善**，期间将对**出货节奏与盈利结构**产生扰动，利好**上游与龙头**价权与份额。[3]\n\n- **外部变量：政策与地缘**  \n  - Citi认为**FCC相关风险短期可控**，行业预计若有新政也会设**1–3年过渡期**；领先厂商已**海外/近岸/在岸**多地建厂对冲不确定性。  \n  - 多家研报仍提示**国际关系、核心器件与供应链波动**等中长期风险需持续跟踪。[1][5]\n\n为便于估计后续配置节奏，卖方以数据侧映射高景气（2026H1）如下图所示：上游**光模块/光器件+GPU/ASIC**增速显著高于下游，指引**自上而下配置先行**的思路延续。[31]  \n![](https://content-collection-rb.oss-cn-beijing.aliyuncs.com/document_parse/2026/09/10/daa81924-acfe-11f1-acf9-5254002b4059/daa81924-acfe-11f1-acf9-5254002b4059_1789034601/auto/images/c46e698156b5691f5db4b01d01af703c7aa2ea750f69c178e494e5066ae2ebf3.jpg \"通信及人工智能子板块 2026H1 营收情况\") [31]\n\n## 4. 投资要点归纳（操作层面）\n\n- **主线一：1.6T放量+龙头“量价/结构”双修复**——优先配置全球客户份额高、**硅光平台化+产能与物料锁定**能力强的龙头（如中际旭创、新易盛），把握**27年NPO/XPO新品**与**海外订单兑现**的二次增量。[20]\n\n- **主线二：NPO/CPO scale-up增量+无源与测试设备价值量提升**——FAU/MPO与**精密耦合/固晶/测试**设备将受益**带宽密度与先进封装**，择优布局**天孚通信**及国内**耦合/测试设备**龙头。[13][14]\n\n- **主线三：上游“卡脖子”与材料平台升级**——聚焦**200G EML、200mW+ CW激光器、InP衬底**与**TFLN晶圆**；跟踪**大厂扩产/长协锁定与国产导入进度**的博弈，受益弹性或先于下游放大。[25][9][10]\n\n- **节奏控制**：短期关注**板块轮动/估值波动**带来的左侧窗口；中期以**订单与新品验证里程碑**（1.6T占比、NPO送样—小批量—量产节奏、TFLN良率改善）为“加仓/调仓”信号。[5][4]", "references_count": 91, "insts": ["国联民生", "兴业证券", "金元证券", "天风证券", "浙商证券", "招商证券", "开源证券", "国泰海通", "中国银河", "国盛证券", "万联证券", "华创证券", "中信建投", "中原证券"]}};

function normalizeCode(code) {
  const raw = String(code || '').trim();
  if (!raw) return '';
  if (raw.includes('.')) return raw;
  if (/^\d{6}$/.test(raw)) return raw.startsWith('6') ? raw + '.SH' : raw + '.SZ';
  return raw + '.HK';
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function shortCode(code) {
  return String(code || '').replace(/\.(SH|SZ|HK|BJ)$/, '');
}

function fmtPct(v) {
  if (v == null || !Number.isFinite(v)) return '—';
  return (v > 0 ? '+' : '') + v.toFixed(2) + '%';
}

function renderWeeklyTreemap(marketValueMap, weeklyPool) {
  const card = document.getElementById('marketValueCard');
  const svg = document.getElementById('weeklyTreemapSvg');
  const meta = document.getElementById('weeklyTreemapMeta');
  if (!card || !svg || !marketValueMap) return;

  const weeklyByCode = new Map((weeklyPool || []).map(stock => [normalizeCode(stock.code), stock]));
  const items = (marketValueMap.stocks || []).map(stock => {
    const weekly = weeklyByCode.get(normalizeCode(stock.code));
    const level1 = String(stock.level1 || weekly?.level1 || '').trim();
    const level2 = String(stock.level2 || weekly?.level2 || level1 || '未分类').trim();
    const level3 = String(stock.level3 || weekly?.level3 || level2 || level1 || '未分类').trim();
    return {
      code: normalizeCode(stock.code),
      name: stock.name || weekly?.name || '—',
      level1,
      level2,
      level3,
      marketCap: Number(stock.market_cap),
      weekReturn: weekly && typeof weekly.pct_w === 'number' ? weekly.pct_w : null,
    };
  }).filter(stock => stock.level1 && stock.level1 !== '指数' && Number.isFinite(stock.marketCap) && stock.marketCap > 0 && Number.isFinite(stock.weekReturn));
  if (!items.length) return;

  const escapeHtml = value => String(value ?? '').replace(/[&<>"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[char]));
  const groupBy = (rows, key) => {
    const groups = new Map();
    rows.forEach(row => {
      const name = row[key] || '未分类';
      if (!groups.has(name)) groups.set(name, []);
      groups.get(name).push(row);
    });
    return [...groups].map(([name, children]) => {
      const value = children.reduce((sum, row) => sum + row.marketCap, 0);
      const weightedReturn = children.reduce((sum, row) => sum + row.marketCap * row.weekReturn, 0) / value;
      return { name, children, value, weightedReturn };
    }).sort((a, b) => b.value - a.value);
  };
  const binaryLayout = (nodes, x, y, width, height) => {
    if (!nodes.length || width <= 0 || height <= 0) return [];
    if (nodes.length === 1) return [{ node: nodes[0], x, y, w: width, h: height }];
    const total = nodes.reduce((sum, node) => sum + node.value, 0);
    let running = 0;
    let split = 1;
    for (let index = 0; index < nodes.length - 1; index += 1) {
      running += nodes[index].value;
      split = index + 1;
      if (running >= total / 2) break;
    }
    const first = nodes.slice(0, split);
    const second = nodes.slice(split);
    const firstValue = first.reduce((sum, node) => sum + node.value, 0);
    const ratio = total > 0 ? firstValue / total : 0.5;
    if (width >= height) {
      const firstWidth = width * ratio;
      return binaryLayout(first, x, y, firstWidth, height).concat(binaryLayout(second, x + firstWidth, y, width - firstWidth, height));
    }
    const firstHeight = height * ratio;
    return binaryLayout(first, x, y, width, firstHeight).concat(binaryLayout(second, x, y + firstHeight, width, height - firstHeight));
  };
  const heat = value => {
    if (!Number.isFinite(value) || Math.abs(value) < 0.005) return '#E8E5DF';
    const alpha = 0.18 + Math.min(Math.abs(value), 12) / 12 * 0.68;
    return value > 0 ? `rgba(220,64,64,${alpha})` : `rgba(42,157,105,${alpha})`;
  };
  const signed = value => `${value > 0 ? '+' : ''}${value.toFixed(2)}%`;
  const width = 1180;
  const height = 620;
  const level1Groups = groupBy(items, 'level1');
  let markup = '';
  binaryLayout(level1Groups, 0, 0, width, height).forEach(level1Rect => {
    markup += `<rect class="weekly-treemap-l1" x="${level1Rect.x}" y="${level1Rect.y}" width="${level1Rect.w}" height="${level1Rect.h}"/>`;
    if (level1Rect.w > 70 && level1Rect.h > 30) {
      markup += `<text class="weekly-treemap-group-label" x="${level1Rect.x + 7}" y="${level1Rect.y + 16}">${escapeHtml(level1Rect.node.name)} ${signed(level1Rect.node.weightedReturn)} · ${(level1Rect.node.value / 10000).toFixed(2)}万亿</text>`;
    }
    const level1Head = level1Rect.h > 45 ? 21 : 0;
    const level2Groups = groupBy(level1Rect.node.children, 'level2');
    binaryLayout(level2Groups, level1Rect.x + 3, level1Rect.y + level1Head, level1Rect.w - 6, level1Rect.h - level1Head - 3).forEach(level2Rect => {
      markup += `<rect class="weekly-treemap-l2" x="${level2Rect.x}" y="${level2Rect.y}" width="${level2Rect.w}" height="${level2Rect.h}"/>`;
      if (level2Rect.w > 75 && level2Rect.h > 28) {
        markup += `<text class="weekly-treemap-sub-label" x="${level2Rect.x + 5}" y="${level2Rect.y + 11}">${escapeHtml(level2Rect.node.name)} ${signed(level2Rect.node.weightedReturn)}</text>`;
      }
      const level2Head = level2Rect.h > 38 ? 15 : 0;
      const level3Groups = groupBy(level2Rect.node.children, 'level3');
      binaryLayout(level3Groups, level2Rect.x + 1, level2Rect.y + level2Head, level2Rect.w - 2, level2Rect.h - level2Head - 1).forEach(level3Rect => {
        const pct = level3Rect.node.weightedReturn;
        const centerX = level3Rect.x + level3Rect.w / 2;
        const centerY = level3Rect.y + level3Rect.h / 2;
        const title = `${level1Rect.node.name} / ${level2Rect.node.name} / ${level3Rect.node.name} | ${level3Rect.node.children.length}只 | 合计市值 ${level3Rect.node.value.toFixed(1)}亿 | 市值加权 ${signed(pct)}`;
        markup += `<g class="weekly-treemap-leaf" data-l1="${escapeHtml(level1Rect.node.name)}" data-l2="${escapeHtml(level2Rect.node.name)}" data-l3="${escapeHtml(level3Rect.node.name)}" onclick="selectTreemapCell(this)"><title>${escapeHtml(title)}</title><rect class="weekly-treemap-cell" fill="${heat(pct)}" x="${level3Rect.x}" y="${level3Rect.y}" width="${level3Rect.w}" height="${level3Rect.h}"/>`;
        if (level3Rect.w > 42 && level3Rect.h > 25) {
          markup += `<text class="weekly-treemap-name" x="${centerX}" y="${centerY - 2}">${escapeHtml(level3Rect.node.name)}</text><text class="weekly-treemap-pct" x="${centerX}" y="${centerY + 11}">${signed(pct)}</text>`;
        }
        markup += '</g>';
      });
    });
  });
  const level3Count = new Set(items.map(stock => `${stock.level1}\u0000${stock.level2}\u0000${stock.level3}`)).size;
  meta.innerHTML = `最小单位 = 三级目录 · 面积 = 目录内股票总市值<br>周涨跌幅 = 内部个股按总市值加权 · 覆盖 ${items.length} 只股票 / ${level3Count} 个三级目录`;
  svg.innerHTML = markup;
  card.style.display = '';
}

function selectTreemapCell(leaf) {
  const svg = document.getElementById('weeklyTreemapSvg');
  if (svg) svg.querySelectorAll('.weekly-treemap-leaf').forEach(g => g.classList.remove('selected'));
  leaf.classList.add('selected');
  const l1 = leaf.dataset.l1, l2 = leaf.dataset.l2, l3 = leaf.dataset.l3;
  // 与 renderWeeklyTreemap 相同的兜底逻辑，保证 level 为空的股票也能匹配
  const stocks = (DATA.stock_metrics || []).filter(s => {
    const sl1 = String(s.level1 || '').trim();
    const sl2 = String(s.level2 || sl1 || '未分类').trim();
    const sl3 = String(s.level3 || sl2 || sl1 || '未分类').trim();
    return sl1 === l1 && sl2 === l2 && sl3 === l3;
  });
  renderTreemapDetail(l1, l2, l3, stocks);
}

function renderTreemapDetail(l1, l2, l3, stocks) {
  const detail = document.getElementById('treemapDetail');
  const head = document.getElementById('treemapDetailHead');
  const body = document.getElementById('treemapDetailBody');
  if (!detail || !head || !body) return;
  const sorted = stocks.slice().sort((a, b) => (b.pct_w ?? -999) - (a.pct_w ?? -999));
  head.innerHTML = `${esc(l1)} / ${esc(l2)} / ${esc(l3)} <span class="hint">共 ${sorted.length} 只，按周涨跌幅排序</span>`;
  body.innerHTML = `<table class="stock-table">
    <thead><tr><th>名称</th><th>代码</th><th class="num">周涨跌幅</th><th class="num">市值(亿)</th><th class="num">周成交额(亿)</th><th class="num">量比</th><th>52周新高</th></tr></thead>
    <tbody>${sorted.map(s => `
      <tr>
        <td>${esc(s.name)}</td>
        <td>${esc(shortCode(s.code))}</td>
        <td class="num ${s.pct_w >= 0 ? 'up' : 'down'}">${fmtPct(s.pct_w)}</td>
        <td class="num">${s.market_cap != null ? Number(s.market_cap).toFixed(0) : '—'}</td>
        <td class="num">${s.turnover != null ? Number(s.turnover).toFixed(0) : '—'}</td>
        <td class="num">${s.volume_ratio != null ? Number(s.volume_ratio).toFixed(2) + '×' : '—'}</td>
        <td>${s.is_52w_high ? '<span class="hl-52w">新高</span>' : ''}</td>
      </tr>`).join('')}
    </tbody>
  </table>`;
  detail.classList.add('show');
}

function ssItem(rank, stock, valHtml) {
  return `<div class="ss-item"><span class="ss-rank">${rank}</span><span class="ss-name" title="${esc(stock.code)}">${esc(stock.name)}</span><span class="ss-code">${esc(shortCode(stock.code))}</span><span class="ss-val">${valHtml}</span></div>`;
}

function renderStockSummary() {
  const gainers = (DATA.top_gainers || []).slice(0, 5);
  const losers = (DATA.top_losers || []).slice(0, 5);
  const volume = DATA.top_volume || [];
  const highs = DATA.new_highs || [];

  const movers = document.getElementById('moversList');
  const volumeList = document.getElementById('volumeList');
  const highsList = document.getElementById('highsList');

  if (movers) {
    let html = gainers.map((s, i) => ssItem(i + 1, s, `<span class="up">${fmtPct(s.pct_w)}</span>`)).join('');
    html += '<div class="ss-divider"></div>';
    html += losers.map((s, i) => ssItem(i + 1, s, `<span class="down">${fmtPct(s.pct_w)}</span>`)).join('');
    movers.innerHTML = html;
  }
  if (volumeList) {
    volumeList.innerHTML = volume.map((s, i) => ssItem(i + 1, s, `<span>${Number(s.volume_ratio).toFixed(2)}×</span>`)).join('') || '<div class="ss-empty">无数据</div>';
  }
  if (highsList) {
    highsList.innerHTML = highs.map((s, i) => ssItem(i + 1, s, `<span class="up">${fmtPct(s.pct_w)}</span>`)).join('') || '<div class="ss-empty">本周无 52 周收盘新高</div>';
  }
}

function renderMarkdown(md) {
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fmt = s => esc(s).replace(/\s*\[\d+\]/g, '').replace(/\*\*([^*]+)\*\*/g, '<span class="hl">$1</span>');
  const lines = String(md || '').split('\n');
  const html = [];
  let inUl = false, contentSeen = false;
  let tableBuf = null;
  const lead = [];
  const closeUl = () => { if (inUl) { html.push('</ul>'); inUl = false; } };
  const flushTable = () => {
    if (!tableBuf || !tableBuf.length) return;
    const rows = tableBuf.filter(l => !/^\s*\|[\s:|-]+\|\s*$/.test(l));
    if (rows.length) {
      const splitRow = l => l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
      const head = splitRow(rows[0]).map(c => `<th>${fmt(c)}</th>`).join('');
      let body = '';
      for (let i = 1; i < rows.length; i++) {
        body += `<tr>${splitRow(rows[i]).map(c => `<td>${fmt(c)}</td>`).join('')}</tr>`;
      }
      html.push(`<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`);
    }
    tableBuf = null;
  };
  for (const raw of lines) {
    const t = raw.trim();
    if (!t) { closeUl(); flushTable(); continue; }
    if (t.startsWith('|')) {
      closeUl();
      (tableBuf = tableBuf || []).push(t);
      contentSeen = true;
      continue;
    }
    flushTable();
    if (t.startsWith('## ')) {
      closeUl();
      html.push(`<h2>${fmt(t.slice(3))}</h2>`);
      contentSeen = true;
    } else if (t.startsWith('- ')) {
      if (!inUl) { html.push('<ul>'); inUl = true; }
      html.push(`<li>${fmt(t.slice(2))}</li>`);
      contentSeen = true;
    } else if (contentSeen && t.length <= 4 && /^[\u4e00-\u9fa5]{1,4}$/.test(t)) {
      closeUl();
      html.push(`<h2>${fmt(t)}</h2>`);
    } else if (!contentSeen) {
      lead.push(fmt(raw));
    } else {
      closeUl();
      html.push(`<p>${fmt(raw)}</p>`);
    }
  }
  flushTable();
  closeUl();
  if (lead.length) html.unshift(`<p class="lead">${lead.join(' ')}</p>`);
  return html.join('\n');
}

function renderSellside(c) {
  if (!c) return '';
  const esc = s => String(s ?? '').replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
  const fmt = s => esc(s).replace(/\s*\[\d+\]/g, '').replace(/\*\*([^*]+)\*\*/g, '<span class="hl">$1</span>');
  const insts = (c.insts || []).join('、');
  const concl = c.conclusion ? `<p class="tl-sellside-concl">${fmt(c.conclusion)}</p>` : '';
  return `<div class="tl-sellside">
    <div class="tl-sellside-head" onclick="this.parentElement.classList.toggle('open')">
      <span class="tl-sellside-icon">📊</span>
      <span>卖方解读 · CIOE 2026 光博会</span>
      <span class="tl-sellside-toggle">▾</span>
    </div>
    <div class="tl-sellside-body">
      ${concl}
      ${renderMarkdown(c.body)}
      <div class="tl-sellside-src">来源：${esc(insts || '—')} · ${c.references_count || 0} 条引用 · 更新 ${c.fetched_at || '—'}</div>
    </div>
  </div>`;
}

function renderTimeline(t) {
  const list = document.getElementById('timelineList');
  const range = document.getElementById('timelineRange');
  if (!list || !t || !t.weeks || !t.weeks.length) return;
  const weeks = t.weeks;
  const recapCount = weeks.filter(w => w.kind === 'recap').length;
  const outlookCount = weeks.filter(w => w.kind === 'outlook').length;
  if (range) range.textContent = `复盘 ${recapCount} 周 · 前瞻 ${outlookCount} 周 · 更新 ${t.fetched_at || ''}`;
  const cioe = DATA && DATA.cioe_sellside;
  list.innerHTML = weeks.map(w => {
    const kindLabel = w.kind === 'recap' ? '复盘' : '前瞻';
    const kindCls = w.kind === 'recap' ? 'kind-recap' : 'kind-outlook';
    const openCls = w.expanded ? ' open' : '';
    const hasCioe = w.kind === 'recap' && cioe && /CIOE|光博会/.test(w.content || '');
    const sellside = hasCioe ? renderSellside(cioe) : '';
    return `<div class="tl-week ${kindCls}${openCls}">
      <div class="tl-rail"></div>
      <div class="tl-dot"></div>
      <div class="tl-week-head" onclick="this.parentElement.classList.toggle('open')">
        <span class="tl-kind">${kindLabel}</span>
        <span class="tl-label">${w.label || ''}</span>
        <span class="tl-toggle">▾</span>
      </div>
      <div class="tl-week-body">${renderMarkdown(w.content)}${sellside}</div>
    </div>`;
  }).join('');
}

function renderWeeklySummary() {
  const card = document.getElementById('weeklySummaryCard');
  const text = document.getElementById('weeklySummaryText');
  const meta = document.getElementById('weeklySummaryMeta');
  const ws = DATA && DATA.weekly_summary;
  if (!card || !text) return;
  if (!ws || !ws.summary) {
    card.style.display = 'none';
    return;
  }
  text.textContent = ws.summary;
  if (meta) {
    meta.textContent = `由 alpha派 基于本周量化数据生成 · 数据日期 ${ws.data_date || DATA.data_date || ''}`;
  }
}

function fmtCapYi(v) {
  if (v == null || !Number.isFinite(v)) return '—';
  if (v >= 10000) return (v / 10000).toFixed(2) + '万亿';
  return v.toFixed(0) + '亿';
}

// 美股美元市值格式化（输入单位：亿美元）
function fmtCapUsd(v) {
  if (v == null || !Number.isFinite(v)) return '—';
  if (v >= 10000) return (v / 10000).toFixed(2) + '万亿美元';
  return v.toFixed(0) + '亿美元';
}

function renderOverseas() {
  const os = DATA && DATA.overseas;
  const leadersEl = document.getElementById('osLeaders');
  if (!os || !leadersEl) return;

  leadersEl.innerHTML = (os.leaders || []).map(s => `
    <div class="os-leader">
      <span class="name">${esc(s.name)}</span>
      <span class="pct ${s.w0 == null ? '' : (s.w0 >= 0 ? 'up' : 'down')}">${fmtPct(s.w0)}</span>
      <span class="cap">${fmtCapUsd(s.market_cap)}</span>
    </div>`).join('');

  const compareEl = document.getElementById('osCompare');
  if (compareEl) {
    const chip = os.chip_anchor;
    const ac = os.a_share_compute;
    const osDate = os.as_of || '';
    const cnDate = (DATA && DATA.data_date) || '';
    const misaligned = osDate && cnDate && osDate !== cnDate;
    if (chip != null && ac != null) {
      const gap = chip - ac;
      const ver = gap >= 0 ? '跑输' : '跑赢';
      let html = `海外算力芯片加权(截至${osDate || '—'}) <b>${fmtPct(chip)}</b> vs A股「算力」大类(截至${cnDate || '—'}) <b>${fmtPct(ac)}</b> → A股${ver}海外 <b>${Math.abs(gap).toFixed(2)}</b> 个百分点`;
      if (misaligned) {
        html += ` <span class="os-warn">⚠ 海外数据未更新至本周（${osDate} vs ${cnDate}），对照为不同周口径，仅供参考</span>`;
      }
      compareEl.innerHTML = html;
    } else {
      compareEl.innerHTML = '本周 A股算力 vs 海外算力芯片数据不完整，跳过对照';
    }
  }

  const catsEl = document.getElementById('osCats');
  if (catsEl) {
    catsEl.innerHTML = (os.categories || []).map(c => `
      <div class="os-cat">
        <span class="cname">${esc(c.cat)}</span>
        <span class="cpct ${c.w0 == null ? '' : (c.w0 >= 0 ? 'up' : 'down')}">${fmtPct(c.w0)}</span>
        <span class="cmeta">${c.n}只</span>
      </div>`).join('');
  }

  const noteEl = document.getElementById('osNote');
  if (noteEl) {
    const md = os.market_dist || {};
    const parts = [];
    if (md.US) parts.push(`美股 ${md.US} 只（美元）`);
    if (md.KRX) parts.push(`韩股 ${md.KRX} 只（韩元）`);
    if (md.TSE) parts.push(`日股 ${md.TSE} 只（日元）`);
    if (md.HKEX) parts.push(`港股 ${md.HKEX} 只（港元）`);
    const dist = parts.length ? parts.join(' · ') : '';
    noteEl.innerHTML = `市值单位按各市场本币计：${dist}。龙头榜仅取美股（统一为亿美元）；韩股/日股因本币口径不同未计入龙头与加权锚，如需要可加汇率换算后并入。`;
  }
}

function init() {
  const dateBadge = document.getElementById('dateBadge');
  if (dateBadge) dateBadge.textContent = DATA && DATA.data_date ? `数据日期 ${DATA.data_date}` : '—';
  renderWeeklySummary();
  renderWeeklyTreemap(DATA.market_value_map, DATA.weekly_pool);
  renderStockSummary();
  renderOverseas();
  if (DATA && DATA.timeline) {
    renderTimeline(DATA.timeline);
  }
}
init();
</script>
