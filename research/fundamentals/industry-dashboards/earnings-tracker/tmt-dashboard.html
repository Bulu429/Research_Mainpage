26%，测算2Q26单季度归母净利在2.08～2.77亿元，同比+163%～251%，环比一季度-16%～+12%。利润环比基本持平，主因HBM项目尚未进入洁净室结算高峰期，Q2海外利润率无异常，预计HBM项目利润率高于VSMC。\n\n此外声明：不存在国内减值较多、VSMC设备move-in延迟、海外项目延期等事项。\n\n集团层面，亚翔工程4-5月合计实现合并营收171.2亿新台币，合人民币36.3亿元，同比+85.5%。我们认为HBM项目土建仍在执行过程中，洁净室建设预计将逐步导入。考虑到M业绩会表态新加坡HBM项目预计1H27投产，且5月底亚翔集团董事长采访中表示，26年下半年运营将更优于上半年，我们预计2H26项目洁净室部分将逐步进入结算高峰期，工程公司结算节奏带来的季度波动是正常现象，公司从未给予市场季度指引，我们认为订单、收入不会消失，因此考察海外利润率是否维持更为重要。\n\n我们维持对公司26-28年盈利预测16/22/24亿元不变，维持“买入”。"}, {"code": "688256.SH", "name": "寒武纪", "industry": "国产", "industry2": "半导体设计", "industry3": "算力芯片", "benchmark": "电子", "official_date": "2026-08-10", "forecast_date": "", "anchor_date": "2026-08-10", "anchor_kind": "正式中报", "q1_25": 2.7596280395, "q2_25": 6.3660404312, "q3_25": 5.0632113023, "q4_25": 3.5104618038, "q1_26": 9.3429710717, "q2_26": 12.312586713499998, "qoq": 31.78, "yoy": 93.41, "forecast_low": null, "forecast_high": null, "forecast_mid": null, "forecast_mid_qoq": null, "market_expect": "", "actual_result": "", "rating": "低于预期", "comment": "市场预期在下降之后是2Q 30亿收入。2月的时候传言全年只有150亿收入，公司辟谣了，现在来看可能真的差不多。"}, {"code": "601138.SH", "name": "工业富联", "industry": "算力", "industry2": "机柜配套", "industry3": "服务器", "benchmark": "电子", "official_date": "2026-08-12", "forecast_date": "2026-07-10", "anchor_date": "2026-08-12", "anchor_kind": "正式中报", "q1_25": 49.02819, "q2_25": 67.65021, "q3_25": 99.89353, "q4_25": 125.31003, "q1_26": 102.49511, "q2_26": 127.34612, "qoq": 24.25, "yoy": 88.24, "forecast_low": 124.50489, "forecast_high": 134.50489, "forecast_mid": 129.50489, "forecast_mid_qoq": 26.35, "market_expect": "", "actual_result": "", "rating": "低于预期", "comment": ""}, {"code": "3986.HK", "name": "兆易创新", "industry": "国产", "industry2": "半导体设计", "industry3": "存储芯片", "benchmark": "电子", "official_date": "2026-08-19", "forecast_date": "2026-07-10", "anchor_date": "2026-08-19", "anchor_kind": "正式中报", "q1_25": 2.2385659491, "q2_25": 3.2057567011000003, "q3_25": 4.9769992692, "q4_25": 4.270643607799999, "q1_26": 14.100642842000001, "q2_26": 34.729691 C端影响，利润剔除一次性影响仍维持平均利润率\n\n#业绩表现\n26H1收入10.31亿元（+22.3%），归母净利润2.47亿元（+4.8%），扣非归母净利润2.08亿元（-1.4%），经营活动现金流净额2.74亿元（+46.6%）。剔除股份支付影响后净利润为2.78亿元（+18.2%）。\n26Q2单季实现收入约5.27亿元（+17.7%），归母净利润约0.91亿元（-23.3%），经营活动现金流0.8亿（+10.5%）。低预期，此前预期收入20-25%，利润率维持25-30%。\n\n#收入低预期主要为商业大数据B/C端影响。分业务看26Q2智能文字识别C段收入+22.9%，B端+15.5%，商业大数据C端-13.9%，B端-13.1%。C端26Q2末MAU 1.99亿（环比+8.7%），过去12个月累计付费用户1020.3万（环比-0.6%），付费率-0.48pct，考虑主要是商业大数据C端影响。\n\n#利润端低预期主要由于1）前期资本市场中介服务费一次性结转管理费用；2）新增股份支付费用；3）AI研发开支加大。按历史管理费用增速测算，Q2一次性影响约0.3-0.4亿，若股份支付费用H1均匀分布，Q2约0.16亿，若不考虑该两项影响，归母净利率仍维持27%左右。\n\n#B端从OCR工具升级为数据底座+Agent+行业应用\nTextIn从传统文档识别升级为企业AI基础设施，XParse负责非结构化数据解析、知识沉淀和RAG数据底座，DocFlow承担流程编排、工具调用和审核执行，启信慧眼在AI寻源、AI营销、AI尽调等场景由工具向Agent升级。\n\n#研发继续加码，重点押注多模态和Agent\n26H1销售/管理/研发费用率分别为29.8%/8.0%/27.1%，同比-1.1/+3.3/+1.6pct；单Q2分别为32.5%/10.8%/27.6%，同比-2.7/+6.2/+3.0pct。公司持续投入多模态大模型、AI Agent、内容安全等方向。\n\n#海外仍是中期关注的增量，短期看扫描全能王AI化和海外变现，长期看TextIn XParse+DocFlow切入企业Agent数据底座和执行层。建议关注未来AI兑现，静待更积极的信号出现。"}, {"code": "688820.SH", "name": "盛合晶微", "industry": "国产", "industry2": "半导体制造", "industry3": "封测", "benchmark": "电子", "official_date": "2026-08-20", "forecast_date": "", "anchor_date": "2026-08-20", "anchor_kind": "正式中报", "q1_25": 0, "q2_25": 0, "q3_25": 0, "q4_25": 0, "q1_26": 1.8765572735, "q2_26": 2.4821998139, "qoq": 32.27, "yoy": null, "forecast_low": null, "forecast_high": null, "forecast_mid": null, "forecast_mid_qoq": null, "market_expect": "", "actual_result": "", "rating": "低于预期", "comment": "业绩看起来不好；单2Q同比仅仅增长2%，毛利率同比也略有下降，净利润同比是下行的；目前还没看到解释，个人理解是产能没有提升的情况下，利润弹性不如稼动率从低到高的长电通富；但也要当心盛合跌业绩带来封测整体回调；"}, {"code": "002484.SZ", "name": "江海股份", "industry": "算力", "industry2": "机柜配套", "industry3": "被动元件", "benchmark": "电子", "official_date": "2026-08-21", "forecast_date": "", "anchor_date": "2026-08-21", "anchor_kind": "正式中报", "q1_25": 1.3718589419999998, "q2_25": 2.0716402813, "q3_25": 1.7268853107, "q4_25": 1.3450411897, "q1_26": 1.5442920968, "q2_26": 2.1756342781, "qoq": 40.88, "yoy": 5.02, "forecast_low": null, "forecast_high": null,
