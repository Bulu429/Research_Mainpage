<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台股电子产业链月度看板</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg:#f8f9fa; --card:#fff; --border:#e9ecef;
  --text:#212529; --text2:#6c757d;
  --accent:#2563eb; --up:#16a34a; --dn:#dc2626; --warn:#d97706;
  --up-bg:#f0fdf4; --dn-bg:#fef2f2; --warn-bg:#fffbeb;
  --tag-bg:#eff6ff; --tag:#1d4ed8;
  --sh: 0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
.hdr{background:var(--card);border-bottom:1px solid var(--border);padding:16px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--sh)}
.hdr-l{display:flex;align-items:center;gap:12px}
.back-link{display:inline-flex;align-items:center;padding:5px 10px;border:1px solid var(--border);border-radius:6px;color:var(--text2);font-size:11px;font-weight:600;text-decoration:none;white-space:nowrap}
.back-link:hover{color:var(--accent);border-color:var(--accent)}
.hdr-title{font-size:20px;font-weight:700}
.badge-tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:12px;font-size:11px;background:var(--tag-bg);color:var(--tag);border:1px solid #bfdbfe}
.hdr-meta{font-size:11px;color:var(--text2);text-align:right}

.wrap{max-width:1400px;margin:0 auto;padding:20px 28px}
.st{font-size:13px;font-weight:700;margin-bottom:11px;padding-bottom:6px;border-bottom:2px solid var(--accent);display:flex;align-items:center;gap:6px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 18px;box-shadow:var(--sh)}

.kpi-g{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:22px}
.kpi .lbl{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.kpi .val{font-size:20px;font-weight:700;margin-bottom:3px}
.kpi .note{font-size:10px;color:var(--text2)}
.c-up{color:var(--up)} .c-dn{color:var(--dn)} .c-warn{color:var(--warn)}

.seg-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:24px}
.seg-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px;cursor:pointer;transition:border-color .15s}
.seg-card:hover{border-color:var(--accent)}
.seg-name{font-size:12px;font-weight:700;margin-bottom:4px}
.seg-row{display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-top:2px}
.lbl2{color:var(--text2)}

.tab-nav{display:flex;gap:0;flex-wrap:wrap;border-bottom:2px solid var(--border);margin-bottom:14px}
.tab-btn{padding:8px 14px;font-size:12px;font-weight:600;color:var(--text2);background:none;border:none;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-2px;transition:color .15s,border-color .15s}
.tab-btn:hover{color:var(--accent)}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-pane{display:none}
.tab-pane.active{display:block}

.ctable{width:100%;border-collapse:collapse;margin-bottom:20px;font-size:12px}
.ctable th{text-align:left;padding:6px 8px;font-size:10px;font-weight:600;color:var(--text2);background:var(--bg);border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer}
.ctable th:hover{color:var(--accent)}
.ctable td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
.ctable td.desc-cell{white-space:normal;color:var(--text2);font-size:11px;min-width:220px}
.ctable tr:last-child td{border-bottom:none}
.ctable tr:hover td{background:#fafbfc}
code{font-size:10px;background:var(--tag-bg);color:var(--tag);padding:1px 5px;border-radius:3px}

.amap-cell{white-space:normal}
.amap{display:inline-block;font-size:10.5px;line-height:1.5;padding:2px 6px;border-radius:5px;cursor:help}
.amap code{background:transparent;padding:0;font-size:9.5px}
.amap-strong{background:var(--up-bg);color:var(--up);border:1px solid #86efac}
.amap-strong code{color:var(--up)}
.amap-mid{background:var(--tag-bg);color:var(--tag);border:1px solid #bfdbfe}
.amap-mid code{color:var(--tag)}
.amap-weak{background:var(--warn-bg);color:var(--warn);border:1px solid #fcd34d}
.amap-weak code{color:var(--warn)}

.chart-box{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:16px}
.chart-box h4{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px}
.chart-wrap{position:relative}

.footnote{font-size:11px;color:var(--text2);margin-top:8px}

@media(max-width:1100px){.kpi-g{grid-template-columns:repeat(2,1fr)}.seg-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.seg-grid{grid-template-columns:repeat(2,1fr)}}


.disclosure{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:0 0 16px;box-shadow:var(--sh)}
.disclosure-head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:10px}
.disclosure-title{font-size:13px;font-weight:700}
.disclosure-badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid #fde68a;background:#fffbeb;color:#92400e}
.disclosure-badge.ok{border-color:#bbf7d0;background:#f0fdf4;color:#166534}
.disclosure-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:10px}
@media(max-width:900px){.disclosure-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.disclosure-item{background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:10px}
.disclosure-item .lbl{font-size:11px;color:var(--text2)}
.disclosure-item .val{font-size:18px;font-weight:700;margin-top:2px}
.disclosure-item .note{font-size:11px;color:var(--text2);margin-top:2px}
.disclosure-missing{font-size:12px;color:var(--text2);line-height:1.7}
.disclosure-missing summary{cursor:pointer;font-weight:600;color:#92400e}
.disclosure-missing ul{margin:8px 0 0 18px;columns:3}
@media(max-width:900px){.disclosure-missing ul{columns:2}}
.data-src-note{font-size:11px;color:var(--text2);margin-top:8px}
#all-tbody td code{font-size:12px}
.card .ctable-wrap,.card{overflow:auto}
.loading{padding:40px;text-align:center;color:var(--text2)}

</style>
</head>
<body>
<!-- industry-dashboard-shell:start -->
<nav class="industry-shell" aria-label="行业看板统一导航">
  <a href="../industry-fundamentals-entry.html">行业看板</a>
  <span aria-hidden="true">/</span>
  <span class="industry-shell__name">台股电子产业链月度看板</span>
  <span class="industry-shell__kind">数据跟踪</span>
  <span class="industry-shell__asof">数据日期与口径见正文</span>
</nav>
<!-- industry-dashboard-shell:end -->
<aside class="industry-review" id="review-banner" style="padding:10px 20px;background:#fff8e5;color:#665424;font-size:12px;line-height:1.7;border-bottom:1px solid #e7ddbc"></aside>

<header class="hdr">
  <div class="hdr-l">
    <a class="back-link" href="../industry-fundamentals-entry.html">← 行业基本面入口</a>
    <div>
      <div class="hdr-title">台股电子产业链月度看板 <span class="badge-tag">AI服务器/PCB/封测/IC设计</span></div>
    </div>
  </div>
  <div class="hdr-meta" id="hdr-meta">加载中…</div>
</header>

<div class="wrap">
  <div id="app" class="loading">正在加载数据层…</div>
</div>

<!-- Data layer: JSON source of truth in ./data/; this JS bundle is generated for Pages + file:// offline -->
<script src="data/dashboard-data.js"></script>
<script>
(function () {
  const bundle = window.TW_ELECTRONICS_DASHBOARD;
  if (!bundle) {
    document.getElementById('app').textContent = '数据层加载失败：缺少 data/dashboard-data.js';
    return;
  }
  const meta = bundle.meta;
  const companies = bundle.companies;
  const CHART_DATA = bundle.charts;

  const fmtNum = (x, d=1) => x == null || Number.isNaN(x) ? '—' : Number(x).toLocaleString('en-US', {minimumFractionDigits:d, maximumFractionDigits:d});
  const fmtPct = (x, d=1) => {
    if (x == null || Number.isNaN(x)) return '—';
    const n = Number(x);
    const s = (n >= 0 ? '+' : '') + n.toFixed(d) + '%';
    return s;
  };
  const pctClass = (x) => {
    if (x == null || Number.isNaN(x)) return '';
    return Number(x) >= 0 ? 'c-up' : 'c-dn';
  };
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // Banner + header
  const disc = meta.disclosure || {};
  document.getElementById('review-banner').innerHTML =
    `<strong>口径说明 · 页面修订${esc(meta.asof_page)}</strong>｜历史快照：行情/市值截至${esc(meta.asof_prices)}；最新可比完整月营收 <strong>${esc(meta.latest_complete_month)}</strong>（${disc.complete_month_disclosed}/${disc.complete_month_total}）。目标跟踪月 <strong>${esc(disc.target_month)}</strong>：${disc.target_disclosed}/${disc.target_total} 已披露，状态「${esc(disc.status_label)}」。市值=收盘价×已发行普通股；涨幅为2025年初至截止日。数据源：证交所/柜买公开月营收、FinMind公开行情。结构化数据见同目录 <code>data/</code>。`;

  document.getElementById('hdr-meta').innerHTML =
    `数据截至 ${esc(meta.asof_prices)} ｜ 单位：${esc(meta.currency_unit)}（市值/月营收）｜ 最新完整月 ${esc(meta.latest_complete_month)}；目标月 ${esc(disc.target_month)} ${esc(disc.status_label)}` +
    `<br>来源：${(meta.sources||[]).map(esc).join('；')} ｜ 数据文件：<code>data/companies.json</code> / <code>meta.json</code> / <code>charts.json</code>`;

  const k = meta.kpis || {};
  const segs = meta.segments || [];

  function amapHtml(a) {
    if (!a) return '—';
    const strength = a.strength || 'weak';
    const cls = strength === 'strong' ? 'amap-strong' : strength === 'mid' ? 'amap-mid' : strength === 'none' ? 'amap-none' : 'amap-weak';
    const title = a.title || a.label || '';
    const name = a.name || a.label || '暂无对标';
    const ticker = a.ticker ? `<br><code>${esc(a.ticker)}</code>` : '';
    return `<span class="amap ${cls}" title="${esc(title)}">${esc(name)}${ticker}</span>`;
  }

  function companyRow(c) {
    return `<tr data-seg="${esc(c.segment)}" data-code="${esc(c.code)}">
      <td>${esc(c.segment)}</td>
      <td><strong>${esc(c.name)}</strong></td>
      <td><code>${esc(c.code)}.TW</code></td>
      <td class="amap-cell">${amapHtml(c.amap)}</td>
      <td data-v="${c.mcap ?? ''}">${c.mcap == null ? '—' : Number(c.mcap).toLocaleString('en-US')}</td>
      <td class="${pctClass(c.ytd)}" data-v="${c.ytd ?? ''}">${fmtPct(c.ytd)}</td>
      <td class="${pctClass(c.d20)}" data-v="${c.d20 ?? ''}">${fmtPct(c.d20)}</td>
      <td data-v="${esc(c.latest_month || '')}">${esc(c.latest_month || '—')}</td>
      <td data-v="${c.rev ?? ''}">${fmtNum(c.rev)}</td>
      <td class="${pctClass(c.mom)}" data-v="${c.mom ?? ''}">${fmtPct(c.mom)}</td>
      <td class="${pctClass(c.yoy)}" data-v="${c.yoy ?? ''}">${fmtPct(c.yoy)}</td>
      <td class="${pctClass(c.cum_yoy)}" data-v="${c.cum_yoy ?? ''}">${fmtPct(c.cum_yoy)}</td>
      <td class="desc-cell">${esc(c.desc)}</td>
    </tr>`;
  }

  function miniTable(seg) {
    const rows = companies.filter(c => c.segment === seg).map(c => `<tr>
      <td><strong>${esc(c.name)}</strong></td>
      <td><code>${esc(c.code)}</code></td>
      <td>${esc(c.latest_month || '—')}</td>
      <td>${fmtNum(c.rev)}</td>
      <td class="${pctClass(c.mom)}">${fmtPct(c.mom)}</td>
      <td class="${pctClass(c.yoy)}">${fmtPct(c.yoy)}</td>
      <td class="${pctClass(c.cum_yoy)}">${fmtPct(c.cum_yoy)}</td>
      <td class="desc-cell">${esc(c.desc)}</td>
    </tr>`).join('');
    return `<div class="card" style="margin-bottom:16px;padding:14px">
      <h4>${esc(seg)} · 各公司月营收趋势（亿新台币）</h4>
      <canvas id="chart-${esc(seg).replace(/[\/]/g,'_')}" height="110"></canvas>
      <div class="table-wrap" style="margin-top:10px"><table class="ctable">
        <thead><tr><th>公司</th><th>代码</th><th>最新月</th><th>月营收(亿)</th><th>单月MoM</th><th>单月YoY</th><th>累计YoY</th><th>业务看点</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>`;
  }

  const missingList = (disc.target_missing_names || []).map(n => `<li>${esc(n)}</li>`).join('');
  const badgeCls = (disc.status === 'complete') ? 'ok' : '';

  const app = `
  <section class="disclosure" aria-label="披露进度">
    <div class="disclosure-head">
      <div class="disclosure-title">披露进度</div>
      <span class="disclosure-badge ${badgeCls}">${esc(disc.status_label || '')} · 目标月 ${esc(disc.target_month)}</span>
    </div>
    <div class="disclosure-grid">
      <div class="disclosure-item"><div class="lbl">目标最新月</div><div class="val">${esc(disc.target_month)}</div><div class="note">例行跟踪月（月中披露窗口）</div></div>
      <div class="disclosure-item"><div class="lbl">目标月已披露</div><div class="val">${disc.target_disclosed} / ${disc.target_total}</div><div class="note">${disc.target_disclosed === 0 ? '名单内均未公开' : ''}</div></div>
      <div class="disclosure-item"><div class="lbl">最新完整月</div><div class="val">${esc(disc.latest_complete_month || meta.latest_complete_month)}</div><div class="note">已披露 ${disc.complete_month_disclosed} / ${disc.complete_month_total}</div></div>
      <div class="disclosure-item"><div class="lbl">状态</div><div class="val" style="font-size:16px">${esc(disc.status_label)}</div><div class="note">页面修订 ${esc(meta.asof_page)}</div></div>
    </div>
    <div class="disclosure-missing">
      <div>${esc(disc.note || '')}</div>
      ${disc.target_disclosed < disc.target_total ? `<details style="margin-top:8px"><summary>未披露名单（${disc.target_total - disc.target_disclosed} 家，${esc(disc.target_month)}）</summary><ul>${missingList}</ul></details>` : ''}
    </div>
  </section>

  <div class="st">概览 KPI</div>
  <div class="kpi-g">
    <div class="kpi card"><div class="lbl">覆盖公司</div><div class="val">${meta.company_count}</div><div class="note">${meta.segment_count}个产业链环节</div></div>
    <div class="kpi card"><div class="lbl">合计市值</div><div class="val">${Number(k.mcap_sum||0).toLocaleString('en-US')}</div><div class="note">亿新台币</div></div>
    <div class="kpi card"><div class="lbl">2025年至今涨幅中位数</div><div class="val">${fmtPct(k.ytd_median)}</div><div class="note">均值受极端值干扰大，改用中位数；最高：${esc(k.ytd_max_name)} ${fmtPct(k.ytd_max)}</div></div>
    <div class="kpi card"><div class="lbl">最新营收同比改善/恶化</div><div class="val"><span class="c-up">${k.yoy_improved}</span> / <span class="c-dn">${k.yoy_worsened}</span></div><div class="note">最新可比披露月份：${esc(meta.latest_complete_month)}</div></div>
  </div>

  <div class="st">产业链环节速览（点击进入对应分页）</div>
  <div class="seg-grid" id="seg-grid">
    ${segs.map((s,i) => `<a class="seg-card card" href="#seg-${i}" data-seg="${esc(s.segment)}">
      <div class="seg-name">${esc(s.segment)}</div>
      <div class="seg-meta">${s.count}家 · ${Number(s.mcap_sum||0).toLocaleString('en-US')}亿</div>
      <div class="seg-ytd">2025年初至今 ${fmtPct(s.ytd_median)}</div>
      <div class="seg-yoy">营收YoY ${fmtPct(s.yoy_median)}</div>
    </a>`).join('')}
  </div>

  <div class="st">公司明细 / 月度营收跟踪</div>
  <div class="tab-nav" id="filters">
    <button class="tab-btn active" data-filter="全部">全部</button>
    ${(meta.segment_order||[]).map(s => `<button class="tab-btn" data-filter="${esc(s)}">${esc(s)}</button>`).join('')}
  </div>
  <div class="card">
    <table class="ctable" id="all-table">
      <thead><tr>
        <th data-k="segment">产业链环节</th>
        <th data-k="name">公司</th>
        <th data-k="code">代码</th>
        <th>A股映射</th>
        <th data-k="mcap">市值(亿)</th>
        <th data-k="ytd">2025年初至今</th>
        <th data-k="d20">近20日</th>
        <th data-k="latest_month">最新月</th>
        <th data-k="rev">月营收(亿)</th>
        <th data-k="mom">单月MoM</th>
        <th data-k="yoy">单月YoY</th>
        <th data-k="cum_yoy">累计YoY</th>
        <th>业务看点</th>
      </tr></thead>
      <tbody id="all-tbody">${companies.map(companyRow).join('')}</tbody>
    </table>
  </div>
  <p class="data-src-note">点击表头可排序；区间涨幅=2025年初至数据截止日涨跌幅，近20日=近20个交易日涨跌幅；单月MoM/YoY基于最新已披露月营收计算，累计YoY=当年累计营收(至最新披露月)同比去年同期累计。</p>

  <div class="st" style="margin-top:22px">分环节月营收趋势</div>
  <div id="sector-panels">
    ${(meta.segment_order||[]).map((s,i) => `<div id="seg-${i}">${miniTable(s)}</div>`).join('')}
  </div>
  `;

  document.getElementById('app').className = '';
  document.getElementById('app').innerHTML = app;

  // Filters
  document.getElementById('filters').addEventListener('click', (e) => {
    const btn = e.target.closest('button.tab-btn');
    if (!btn) return;
    document.querySelectorAll('#filters .tab-btn').forEach(b => b.classList.toggle('active', b === btn));
    const f = btn.dataset.filter;
    document.querySelectorAll('#all-tbody tr').forEach(tr => {
      tr.style.display = (f === '全部' || tr.dataset.seg === f) ? '' : 'none';
    });
  });

  // Sort
  let sortState = { key: null, asc: true };
  document.querySelectorAll('#all-table thead th[data-k]').forEach(th => {
    th.style.cursor = 'pointer';
    th.addEventListener('click', () => {
      const key = th.dataset.k;
      sortState.asc = (sortState.key === key) ? !sortState.asc : false;
      sortState.key = key;
      const rows = Array.from(document.querySelectorAll('#all-tbody tr'));
      const idx = Array.from(th.parentNode.children).indexOf(th);
      rows.sort((a, b) => {
        const av = a.children[idx].dataset.v ?? a.children[idx].textContent.trim();
        const bv = b.children[idx].dataset.v ?? b.children[idx].textContent.trim();
        const an = parseFloat(av), bn = parseFloat(bv);
        let cmp;
        if (!Number.isNaN(an) && !Number.isNaN(bn)) cmp = an - bn;
        else cmp = String(av).localeCompare(String(bv), 'zh');
        return sortState.asc ? cmp : -cmp;
      });
      const tbody = document.getElementById('all-tbody');
      rows.forEach(r => tbody.appendChild(r));
    });
  });

  // Charts
  const palette = ['#2563eb','#dc2626','#16a34a','#d97706','#7c3aed','#0891b2','#db2777','#65a30d'];
  (meta.segment_order || []).forEach((seg, idx) => {
    const d = CHART_DATA[String(idx)];
    if (!d) return;
    const canvas = document.getElementById('chart-' + seg.replace(/[\/]/g, '_'));
    if (!canvas || typeof Chart === 'undefined') return;
    new Chart(canvas.getContext('2d'), {
      type: 'line',
      data: {
        labels: d.labels,
        datasets: (d.series || []).map((s, i) => ({
          label: s.name,
          data: s.data,
          borderColor: palette[i % palette.length],
          backgroundColor: 'transparent',
          tension: 0.2,
          pointRadius: 0,
          borderWidth: 1.5,
          spanGaps: false,
        }))
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } } },
        scales: {
          x: { ticks: { maxTicksLimit: 12, font: { size: 9 } } },
          y: { ticks: { font: { size: 9 } } }
        }
      }
    });
  });
})();
</script>
